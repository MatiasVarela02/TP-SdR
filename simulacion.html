<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Simulador de Incendio - Propagación Realista por Puertas</title>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body {
      margin: 0; overflow: hidden; background-color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    canvas { display: block; touch-action: none; }

    /* ============ BOTÓN HAMBURGUESA (solo móvil) ============ */
    #btn-menu {
      display: none;
      position: fixed;
      top: 10px; left: 10px;
      width: 46px; height: 46px;
      background: rgba(0,0,0,0.88);
      color: #fff;
      border: 2px solid rgba(255,150,0,0.65);
      border-radius: 10px;
      font-size: 22px;
      cursor: pointer;
      z-index: 101;
      align-items: center;
      justify-content: center;
      user-select: none; -webkit-user-select: none;
      transition: background 0.2s, transform 0.1s;
    }
    #btn-menu:active { transform: scale(0.94); background: #ff5500; }

    #ui-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 99;
    }

    /* ============ UI DE ESCRITORIO (sin cambios) ============ */
    #ui {
      position: absolute; top: 15px; left: 15px; color: #fff;
      background: rgba(0,0,0,0.85); padding: 15px 20px; border-radius: 8px;
      font-size: 14px; line-height: 1.6; width: 260px;
    }
    .control-group { margin-top: 10px; }
    label { cursor: pointer; display: block; margin-bottom: 5px; transition: 0.2s; }
    label:hover { color: #ff5500; }
    input[type="checkbox"] { margin-right: 8px; cursor: pointer; }
    input[type="range"] { cursor: pointer; accent-color: #ff5500; }
    hr { border: 0; border-top: 1px solid #555; margin: 12px 0; }
    .speed-group { display: flex; gap: 5px; margin-top: 5px; }
    .speed-btn {
      flex: 1; padding: 6px 0; background-color: #333; color: white;
      border: 1px solid #555; border-radius: 4px; cursor: pointer;
      font-size: 12px; transition: 0.2s; text-align: center;
    }
    .speed-btn:hover { background-color: #555; }
    .speed-btn.active { background-color: #ff5500; border-color: #ff7700; font-weight: bold; }
    .action-btn {
      margin-top: 10px; width: 100%; padding: 8px; background-color: #444;
      color: white; border: 1px solid #666; border-radius: 4px;
      cursor: pointer; font-weight: bold; transition: background 0.2s;
    }
    .action-btn:hover { background-color: #d93600; border-color: #ff5500; }
    #btn-detener-humo.stopped { background-color: #ff5500; border-color: #ff7700; }

    .action-btn.btn-alarm {
      background-color: #c62828; border-color: #e53935;
    }
    .action-btn.btn-alarm:hover { background-color: #d32f2f; border-color: #f44336; }
    .action-btn.btn-alarm.active {
      background-color: #e65100; border-color: #ff9800;
      animation: pulse-alarm 1.2s infinite alternate;
    }
    @keyframes pulse-alarm {
      0% { box-shadow: 0 0 4px #ff5500; }
      100% { box-shadow: 0 0 16px #ff1100; }
    }
    .badge-normal {
      margin-top: 8px; padding: 6px 10px; background: rgba(0,200,83,0.15);
      border: 1px solid #00c853; color: #69f0ae; border-radius: 6px;
      font-size: 12px; font-weight: bold; text-align: center;
    }
    .badge-alerta {
      margin-top: 8px; padding: 6px 10px; background: rgba(255,61,0,0.25);
      border: 1px solid #ff3d00; color: #ff9e80; border-radius: 6px;
      font-size: 12px; font-weight: bold; text-align: center;
      animation: pulse-badge 1s infinite alternate;
    }
    @keyframes pulse-badge { 0% { opacity:0.8; } 100% { opacity:1.0; } }

    #contador-muertes {
      margin-top: 4px;
      font-size: 26px; font-weight: bold; text-align: center;
      color: #ff4444; letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(255,0,0,0.6);
    }

    /* Contador de víctimas fijo — oculto en escritorio */
    #victimas-movil { display: none; }

    #tabla-seguridad {
      position: absolute; top: 15px; right: 15px; color: #fff;
      background: rgba(0,0,0,0.85); padding: 12px 15px; border-radius: 8px;
      font-size: 14px; min-width: 240px;
    }
    #tabla-seguridad h3 { margin: 0 0 8px 0; font-size: 14px; color: #ff9955; letter-spacing: 0.5px; }
    #tabla-seguridad table { width: 100%; border-collapse: collapse; }
    #tabla-seguridad th, #tabla-seguridad td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #444; }
    #tabla-seguridad th { color: #ccc; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    #tabla-seguridad td.estado-normal        { color: #4fff4f; font-weight: bold; }
    #tabla-seguridad td.estado-peligroso     { color: #ffdd33; font-weight: bold; }
    #tabla-seguridad td.estado-muy-peligroso { color: #ff8800; font-weight: bold; }
    #tabla-seguridad td.estado-mortal        { color: #ff4444; font-weight: bold; }

    #minimapa-marco {
      position: absolute; bottom: 15px; right: 15px;
      width: 280px; height: 280px;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 8px; overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8);
      pointer-events: none; z-index: 10;
    }
    #minimapa-titulo {
      background: rgba(0,0,0,0.85); color: #ff9955;
      font-size: 12px; font-weight: bold; text-align: center;
      padding: 6px 0; text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid #444;
    }

    /* ============ MÓVIL / TABLET ============ */
    @media (max-width: 768px), (pointer: coarse) and (max-width: 900px) {
      #btn-menu { display: flex; }

      /* Panel de control oculto por defecto en móvil */
      #ui { display: none; }

      body.ui-open #ui-overlay { display: block; }

      body.ui-open #ui {
        display: block;
        position: fixed;
        top: 62px; left: 8px; right: 8px;
        bottom: auto;
        width: auto;
        max-height: calc(100vh - 176px);
        max-height: calc(100dvh - 176px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        z-index: 100;
        font-size: 13px;
        padding: 12px 14px 18px;
        line-height: 1.5;
        scrollbar-width: thin;
        scrollbar-color: #ff5500 rgba(255,255,255,0.12);
      }
      body.ui-open #ui::-webkit-scrollbar { width: 6px; }
      body.ui-open #ui::-webkit-scrollbar-track { background: rgba(255,255,255,0.12); border-radius: 3px; }
      body.ui-open #ui::-webkit-scrollbar-thumb { background: #ff5500; border-radius: 3px; }

      /* Controles más táctiles */
      body.ui-open input[type="checkbox"] { width: 18px; height: 18px; vertical-align: middle; }
      body.ui-open label { padding: 5px 0; font-size: 14px; margin-bottom: 3px; }
      body.ui-open .speed-btn,
      body.ui-open .action-btn {
        padding: 11px 0; font-size: 13px; min-height: 42px;
      }
      body.ui-open input[type="range"] { min-height: 26px; width: 100% !important; }
      body.ui-open hr { margin: 10px 0; }

      /* Tabla de seguridad arriba a la derecha cuando UI cerrada */
      #tabla-seguridad {
        position: fixed;
        top: 10px; right: 10px;
        left: auto; bottom: auto;
        width: auto;
        min-width: 0;
        max-width: 60vw;
        z-index: 50;
        font-size: 11px;
        padding: 8px 10px;
        line-height: 1.3;
      }
      #tabla-seguridad h3 { font-size: 11px; margin-bottom: 5px; }
      #tabla-seguridad th, #tabla-seguridad td { padding: 3px 5px; font-size: 11px; }
      #tabla-seguridad th { font-size: 9px; }

      /* Con el menú abierto ocultamos tabla y minimapa para no tapar el panel */
      body.ui-open #tabla-seguridad,
      body.ui-open #minimapa-marco { display: none; }

      #minimapa-marco {
        width: 128px; height: 128px;
        bottom: 8px; right: 8px;
        top: auto; left: auto;
        border-width: 1px;
        z-index: 49;
      }
      #minimapa-titulo { font-size: 10px; padding: 4px 0; }

      /* Ajustes menores de legibilidad en textos */
      .speed-btn { font-size: 11px; }
      .action-btn { font-size: 12px; }

      /* ---------- Contador de víctimas fijo (solo móvil) ---------- */
      .victimas-section { display: none; }

      #victimas-movil {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        left: 8px; bottom: 8px;
        min-width: 104px;
        padding: 6px 14px 8px;
        background: rgba(0,0,0,0.88);
        border: 1px solid rgba(255,85,0,0.6);
        border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.7);
        z-index: 102;
        pointer-events: none;
        text-align: center;
      }
      #victimas-movil-titulo {
        font-size: 10px; font-weight: bold;
        letter-spacing: 1px; text-transform: uppercase;
        color: #ff9955;
      }
      #contador-muertes-movil {
        font-size: 24px; font-weight: bold; line-height: 1.1;
        color: #ff4444; letter-spacing: 1px;
        text-shadow: 0 0 8px rgba(255,0,0,0.6);
      }
    }

    @media (max-width: 400px) {
      #minimapa-marco { width: 108px; height: 108px; }
      #tabla-seguridad { font-size: 10px; padding: 6px 8px; }
      #tabla-seguridad td { padding: 2px 4px; }
    }
  </style>
</head>
<body>
  <button id="btn-menu" type="button" aria-label="Menú">☰</button>
  <div id="ui-overlay"></div>

  <div id="ui">
    <strong>Focos de Incendio</strong>
    <div class="control-group">
      <label><input type="checkbox" id="chk-foco1"> Salón grande</label>
      <label><input type="checkbox" id="chk-foco2"> Pasillo</label>
      <label><input type="checkbox" id="chk-foco3"> Salón pequeño</label>
    </div>
    <hr>
    <strong>Velocidad de Simulación</strong>
    <div class="speed-group">
      <button id="btn-1x" class="speed-btn active">Normal 1x</button>
      <button id="btn-2x" class="speed-btn">Rápido 2x</button>
    </div>
    <hr>
    <strong>Ventilación</strong>
    <div class="control-group">
      <label><input type="checkbox" id="chk-ventanas"> Abrir Ventanas</label>
    </div>
    <hr>
    <button id="btn-detener-humo" class="action-btn">Detener Humo</button>
    <button id="btn-limpiar" class="action-btn">Limpiar Humo y Enfriar</button>
    <hr>
    <strong>Personas</strong>
    <div class="control-group">
      <label><input type="checkbox" id="chk-personas" checked> Mostrar Personas</label>
      <label><input type="checkbox" id="chk-movimiento" checked> Habilitar Movimiento</label>
      <label><input type="checkbox" id="chk-evacuacion" checked> Evacuar al detectar humo</label>
      <div style="margin-top: 8px;">
        <label style="display:flex; justify-content:space-between; margin-bottom: 2px;">
          <span>Salón Grande (Max 38):</span> <span id="lbl-cant-grande">8</span>
        </label>
        <input type="range" id="rng-cant-grande" min="0" max="38" value="8" style="width: 100%;">
      </div>
      <div style="margin-top: 8px;">
        <label style="display:flex; justify-content:space-between; margin-bottom: 2px;">
          <span>Salón Pequeño (Max 16):</span> <span id="lbl-cant-pequeno">4</span>
        </label>
        <input type="range" id="rng-cant-pequeno" min="0" max="16" value="4" style="width: 100%;">
      </div>
      <div style="margin-top: 8px;">
        <label style="display:flex; justify-content:space-between; margin-bottom: 2px;">
          <span>Velocidad:</span> <span id="lbl-personas-vel">1.2x</span>
        </label>
        <input type="range" id="rng-personas-vel" min="0.5" max="3.0" step="0.5" value="1.2" style="width: 100%;">
      </div>
    </div>
    <button id="btn-reset-personas" class="action-btn" style="margin-top: 8px;">Reubicar en Computadoras</button>
    <div class="victimas-section">
      <hr>
      <strong>Víctimas</strong>
      <div id="contador-muertes">0</div>
    </div>
  </div>

  <!-- Contador de víctimas fijo (solo se muestra en móvil) -->
  <div id="victimas-movil">
    <div id="victimas-movil-titulo">Víctimas</div>
    <div id="contador-muertes-movil">0</div>
  </div>

  <div id="tabla-seguridad">
    <h3>Estado de Seguridad</h3>
    <table>
      <thead>
        <tr><th>Ubicación</th><th>Seguridad</th></tr>
      </thead>
      <tbody>
        <tr><td>Salón grande</td>  <td id="estado-salon-grande"  class="estado-normal">Normal</td></tr>
        <tr><td>Pasillo</td>       <td id="estado-pasillo"       class="estado-normal">Normal</td></tr>
        <tr><td>Salón pequeño</td> <td id="estado-salon-pequeno" class="estado-normal">Normal</td></tr>
      </tbody>
    </table>
  </div>

  <div id="minimapa-marco">
    <div id="minimapa-titulo">MAPA DE CALOR</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    /* ============================================================
       DETECCIÓN DE MÓVIL — ajusta calidad automáticamente
       ============================================================ */
    const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches ||
                      /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    let simSpeed = 1.0;
    let isSmokeGenerating = true;

    const TECHO_HUMO        = 2.55;
    const MAX_SMOKE         = IS_MOBILE ? 2500 : 6000;
    const SMOKE_FLOOR       = 0.6;
    const SMOKE_SPAWN_Y     = 0.7;
    const SMOKE_STRIDE      = 4;
    const HEATMAP_INTENSITY = 0.45;
    const HEATMAP_EVERY     = IS_MOBILE ? 3 : 2;
    const VELOCIDAD_HUMO    = 0.4;

    /* ---------- Sensibilidad del humo para evacuar ---------- */
    const HUMO_THRESHOLD    = 1.2;

    const ROOM_STATUS_EVERY = 1;
    const ROOM_RED_T        = 0.30;
    const ROOM_YELLOW_T     = 0.08;
    const ROOM_RED_PCT      = 0.28;
    const ROOM_AVG_MORTAL   = 16;
    const ROOM_VD_RED_PCT   = 0.15;
    const ROOM_VD_WARM_PCT  = 0.35;
    const ROOM_AVG_VDANGER  = 8;
    const ROOM_WARM_PCT     = 0.10;
    const ROOM_AVG_DANGER   = 2;

    /* ---------- Parámetros de personas ---------- */
    const PERSON_BASE_SPEED_SCALE = 0.5;
    const CONTAGION_RADIUS        = 0.9;
    const DEATH_TIME_LIMIT        = 20.0;

    const HEAT_SPEED_YELLOW_T = 0.25;
    const HEAT_SPEED_ORANGE_T = 0.50;
    const HEAT_SPEED_RED_T    = 0.75;

    /* ---------- Barreras invisibles ---------- */
    let windowsOpen = false;
    let alarmActive = false;

    const BARRIERS = [
      { x1: 19.9, z1: -6.0,  x2: 20.9, z2: -15.0 },
      { x1: 11.0, z1: -6.5,  x2: 14.0, z2: -6.5  }
    ];

    function segmentsIntersect(x1, z1, x2, z2, x3, z3, x4, z4) {
      const d = (x2 - x1) * (z4 - z3) - (z2 - z1) * (x4 - x3);
      if (Math.abs(d) < 1e-10) return false;
      const t = ((x3 - x1) * (z4 - z3) - (z3 - z1) * (x4 - x3)) / d;
      const u = ((x3 - x1) * (z2 - z1) - (z3 - z1) * (x2 - x1)) / d;
      return t >= 0 && t <= 1 && u >= 0 && u <= 1;
    }

    function wouldHitBarrier(px, pz, nx, nz) {
      if (windowsOpen) return false;
      for (let b = 0; b < BARRIERS.length; b++) {
        const bar = BARRIERS[b];
        if (segmentsIntersect(px, pz, nx, nz, bar.x1, bar.z1, bar.x2, bar.z2)) return true;
      }
      return false;
    }

    let collisionGrid = null;
    let gridMinX = 0, gridMinZ = 0;
    let gridStepsX = 0, gridStepsZ = 0;
    const GRID_RES = 0.08;
    const ALTURA_CORTE = 1.2;
    const PADDING_CELDAS = 1;

    const ROOMS = [
      { id:'estado-salon-grande',  name:'Salón grande', minX:12, maxX:22, minZ:-16, maxZ:-6 },
      { id:'estado-pasillo',       name:'Pasillo',
        minX:5, maxX:13, minZ:-12, maxZ:-4,
        redPct:0.12, avgMortal:6,
        vdRedPct:0.06, vdWarmPct:0.20, avgVDanger:3.5,
        warmPct:0.06, avgDanger:1.2 },
      { id:'estado-salon-pequeno', name:'Salón pequeño', minX:-3, maxX:5, minZ:-9, maxZ:-1 }
    ];
    ROOMS.forEach(r => r.estado = 'Normal');

    function setSpeed(speed, btnId) {
      simSpeed = speed;
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(btnId).classList.add('active');
    }
    document.getElementById('btn-1x').addEventListener('click', () => setSpeed(1.0, 'btn-1x'));
    document.getElementById('btn-2x').addEventListener('click', () => setSpeed(2.0, 'btn-2x'));

    /* ============================================================
       MENÚ HAMBURGUESA MÓVIL
       ============================================================ */
    const btnMenu = document.getElementById('btn-menu');
    const uiOverlay = document.getElementById('ui-overlay');

    function toggleMenu(force) {
      const open = (typeof force === 'boolean') ? force : !document.body.classList.contains('ui-open');
      document.body.classList.toggle('ui-open', open);
      btnMenu.textContent = open ? '✕' : '☰';
      btnMenu.setAttribute('aria-label', open ? 'Cerrar menú' : 'Abrir menú');
    }

    btnMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMenu();
    });
    uiOverlay.addEventListener('click', () => toggleMenu(false));

    /* ---------- Escena base ---------- */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd9dfe5);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(35, 30, 40);
    camera.layers.enable(1);

    const renderer = new THREE.WebGLRenderer({
      antialias: !IS_MOBILE,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_MOBILE ? 1.0 : 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;
    // En móvil: 1 dedo rota, 2 dedos zoom + pan (comportamiento por defecto)
    controls.touches = {
      ONE: THREE.TOUCH.ROTATE,
      TWO: THREE.TOUCH.DOLLY_PAN
    };

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(20, 40, 20);
    sun.castShadow = true;
    const shadowSize = IS_MOBILE ? 512 : 1024;
    sun.shadow.mapSize.set(shadowSize, shadowSize);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far  = 120;
    sun.shadow.camera.left = -40;
    sun.shadow.camera.right = 40;
    sun.shadow.camera.top = 40;
    sun.shadow.camera.bottom = -40;
    scene.add(sun);

    /* ============================================================

        if (i >= 0 && i < gridStepsX && j >= 0 && j < gridStepsZ && isInsideRoomGeometry(s.x, s.z)) {

          if (collisionGrid[idx] === 0 && insideGrid[idx] === 0) {
            insideGrid[idx] = 1;
            queue.push(i, j);

        }
      });

      let head = 0;
      while (head < queue.length) {
        const ci = queue[head++];
        const cj = queue[head++];
        const cx = gridMinX + ci * GRID_RES;
        const cz = gridMinZ + cj * GRID_RES;

        walkableList.push({ x: cx, z: cz });

        const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        for (let d = 0; d < 4; d++) {
          const ni = ci + dirs[d][0];

          if (ni >= 0 && ni < gridStepsX && nj >= 0 && nj < gridStepsZ && isInsideRoomGeometry(nx, nz)) {

            if (collisionGrid[nidx] === 0 && insideGrid[nidx] === 0) {

              queue.push(ni, nj);

          }
        }
      }

      const gridMaxZ = bbox.max.z + gridMargin;

      gridStepsX = Math.ceil((gridMaxX - gridMinX) / GRID_RES);
      gridStepsZ = Math.ceil((gridMaxZ - gridMinZ) / GRID_RES);
      collisionGrid = new Uint8Array(gridStepsX * gridStepsZ);

              for (let dj = -PADDING_CELDAS; dj <= PADDING_CELDAS; dj++) {
                const ni = i + di, nj = j + dj;
                if (ni >= 0 && ni < gridStepsX && nj >= 0 && nj < gridStepsZ)

                if (ni >= 0 && ni < gridStepsX && nj >= 0 && nj < gridStepsZ)

    let exitDistField = null;

    function buildExitField() {
      if (!insideGrid) return;
      const N = gridStepsX * gridStepsZ;
      exitDistField = new Int32Array(N);
      exitDistField.fill(-1);

      let startIdx = -1;
      let bestD2 = Infinity;
      for (let j = 0; j < gridStepsZ; j++) {
        for (let i = 0; i < gridStepsX; i++) {
          const idx = i + j * gridStepsX;
          if (insideGrid[idx] !== 1) continue;
          const x = gridMinX + i * GRID_RES;
          const z = gridMinZ + j * GRID_RES;
          const d2 = (x - EXIT_GOAL_POS.x) ** 2 + (z - EXIT_GOAL_POS.z) ** 2;
          if (d2 < bestD2) { bestD2 = d2; startIdx = idx; }
        }
      }
      if (startIdx < 0) { console.warn('Salida no alcanzable'); return; }

      exitDistField[startIdx] = 0;
      const queue = [startIdx];
      let head = 0;
      while (head < queue.length) {
        const curr = queue[head++];
        const d = exitDistField[curr];
        const ci = curr % gridStepsX;
        const cj = (curr - ci) / gridStepsX;

        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for (let k = 0; k < 4; k++) {
          const ni = ci + dirs[k][0];
          const nj = cj + dirs[k][1];
          if (ni < 0 || ni >= gridStepsX || nj < 0 || nj >= gridStepsZ) continue;
          const nidx = ni + nj * gridStepsX;
          if (exitDistField[nidx] !== -1) continue;
          if (insideGrid[nidx] !== 1) continue;
          exitDistField[nidx] = d + 1;
          queue.push(nidx);
        }
      }
    }

    function getFlowDirection(x, z) {
      if (!exitDistField) return null;
      const i = Math.floor((x - gridMinX) / GRID_RES);
      const j = Math.floor((z - gridMinZ) / GRID_RES);
      if (i < 0 || i >= gridStepsX || j < 0 || j >= gridStepsZ) return null;
      const currDist = exitDistField[i + j * gridStepsX];
      if (currDist < 0) return null;
      if (currDist === 0) return { x: 0, z: 0, arrived: true };

      let bestDist = currDist;
      let bestDx = 0, bestDz = 0;
      for (let di = -1; di <= 1; di++) {
        for (let dj = -1; dj <= 1; dj++) {
          if (di === 0 && dj === 0) continue;
          const ni = i + di;
          const nj = j + dj;
          if (ni < 0 || ni >= gridStepsX || nj < 0 || nj >= gridStepsZ) continue;
          const nd = exitDistField[ni + nj * gridStepsX];
          if (nd < 0) continue;
          if (nd < bestDist) {
            bestDist = nd;
            bestDx = di;
            bestDz = dj;
          }
        }
      }
      if (bestDx === 0 && bestDz === 0) return null;

      return { x: bestDx / len, z: bestDz / len };

      const legMat = new THREE.MeshStandardMaterial({ color: 0x111115, metalness: 0.8, roughness: 0.3 });

      [[-0.30, -0.20], [0.30, -0.20], [-0.30, 0.20], [0.30, 0.20]].forEach(([lx, lz]) => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(lx, 0.35, lz);
        leg.castShadow = true;
        group.add(leg);
      });

      // Silla de Oficina
      const chairMat = new THREE.MeshStandardMaterial({ color: 0x1e2229, roughness: 0.8 });
      const seatGeo = new THREE.BoxGeometry(0.36, 0.05, 0.36);
      const seat = new THREE.Mesh(seatGeo, chairMat);
      seat.position.set(0, 0.45, 0.35);
      seat.castShadow = true;
      group.add(seat);

      const backGeo = new THREE.BoxGeometry(0.36, 0.35, 0.05);
      const back = new THREE.Mesh(backGeo, chairMat);
      back.position.set(0, 0.65, 0.51);
      back.castShadow = true;
      group.add(back);

      const baseLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.42, 8), legMat);
      baseLeg.position.set(0, 0.21, 0.35);
      group.add(baseLeg);

      // Monitor
      const monMat = new THREE.MeshStandardMaterial({ color: 0x0f1115, roughness: 0.4 });
      const monBase = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.02, 0.15), monMat);
      monBase.position.set(0, 0.74, -0.10);
      group.add(monBase);

      const monStand = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.18, 0.03), monMat);
      monStand.position.set(0, 0.83, -0.12);
      group.add(monStand);

      // Pantalla de computadora (encendida cyan/blue)
      const screenGeo = new THREE.BoxGeometry(0.42, 0.28, 0.025);
      const screenMat = new THREE.MeshStandardMaterial({
        color: 0x00d2ff,
        emissive: 0x0055aa,
        emissiveIntensity: 0.7,
        roughness: 0.2
      });
      const screen = new THREE.Mesh(screenGeo, screenMat);
      screen.position.set(0, 0.94, -0.11);
      screen.castShadow = true;
      group.add(screen);

      // Teclado
      const kbMat = new THREE.MeshStandardMaterial({ color: 0x181a20, roughness: 0.6 });
      const kb = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.015, 0.12), kbMat);
      kb.position.set(0, 0.73, 0.08);
      group.add(kb);

      group.position.set(x, 0, z);
      group.rotation.y = rotationY;
      scene.add(group);

      const seatLocalPos = new THREE.Vector3(0, 0, 0.35);
      seatLocalPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotationY);
      const seatWorldPos = new THREE.Vector3(x + seatLocalPos.x, 0, z + seatLocalPos.z);

      const ws = { group, screenMat, x, z, rotationY, seatPos: seatWorldPos, occupied: false, roomId };
      workstations.push(ws);
      return ws;
    }

    // 38 Puestos en Salón Grande (Room 0)
    const colsGrande = [13.35, 14.20, 15.05, 15.90, 16.75, 17.60, 18.45, 19.30];
    const colsGrande2 = [15.5, 16.35, 17.2, 18.05, 18.9, 19.75];
    colsGrande.forEach(x => createWorkstation(x, -7.4, 0, 'salon-grande'));
    colsGrande.forEach(x => createWorkstation(x, -8.6, Math.PI, 'salon-grande'));
    colsGrande.forEach(x => createWorkstation(x, -10.2, 0, 'salon-grande'));
    colsGrande.forEach(x => createWorkstation(x, -11.4, Math.PI, 'salon-grande'));
    colsGrande2.forEach(x => createWorkstation(x, -12.8, 0, 'salon-grande'));

    // 16 Puestos en Salón Pequeño (Room 2)
    // Pared Norte
    createWorkstation(1.10, -0.84, Math.PI, 'salon-pequeno');
    createWorkstation(2.20, -0.84, Math.PI, 'salon-pequeno');
    createWorkstation(3.30, -0.84, Math.PI, 'salon-pequeno');
    // Pared Sur
    createWorkstation(0.80, -8.06, 0, 'salon-pequeno');
    createWorkstation(1.80, -8.06, 0, 'salon-pequeno');
    createWorkstation(2.80, -8.06, 0, 'salon-pequeno');
    // Pared Este
    createWorkstation(3.30, -5.22, -Math.PI / 2, 'salon-pequeno');
    createWorkstation(3.30, -4.45, -Math.PI / 2, 'salon-pequeno');
    createWorkstation(3.30, -3.68, -Math.PI / 2, 'salon-pequeno');
    createWorkstation(3.30, -2.91, -Math.PI / 2, 'salon-pequeno');
    createWorkstation(3.30, -2.14, -Math.PI / 2, 'salon-pequeno');
    // Pared Oeste
    createWorkstation(0.70, -6.72, Math.PI / 2, 'salon-pequeno');
    createWorkstation(0.70, -5.72, Math.PI / 2, 'salon-pequeno');
    createWorkstation(0.70, -4.45, Math.PI / 2, 'salon-pequeno');
    createWorkstation(0.70, -3.40, Math.PI / 2, 'salon-pequeno');
    createWorkstation(0.70, -2.28, Math.PI / 2, 'salon-pequeno');

    /* ============================================================
       SISTEMA DE PERSONAS
       ============================================================ */
    const people = [];
    const PERSON_COLORS = [
      0x2266ff, 0xff8800, 0x22cc55, 0xee3333, 0x9933ff,
      0x00cccc, 0xee0088, 0xffbb00, 0x3388ff, 0x00aa77
    ];

    let isPeopleVisible = true;
    let isPeopleMoving  = true;
    let evacuationMode  = true;
    let peopleSpeedMultiplier = 1.2;
    let deathCount = 0;

    const elContadorMuertes      = document.getElementById('contador-muertes');
    const elContadorMuertesMovil = document.getElementById('contador-muertes-movil');

    function updateDeathCounter() {
      if (elContadorMuertes)      elContadorMuertes.textContent      = deathCount;
      if (elContadorMuertesMovil) elContadorMuertesMovil.textContent = deathCount;
    }

    const EXIT_ZONE_RADIUS = 1.0;

    function isWalkable(x, z) {
      if (!insideGrid || !isInsideRoomGeometry(x, z)) return false;
      const i = Math.floor((x - gridMinX) / GRID_RES);
      const j = Math.floor((z - gridMinZ) / GRID_RES);
      if (i < 0 || i >= gridStepsX || j < 0 || j >= gridStepsZ) return false;
      return insideGrid[i + j * gridStepsX] === 1;
    }

    function isNearExit(x, z) {
      const dx = x - EXIT_GOAL_POS.x;
      const dz = z - EXIT_GOAL_POS.z;
      return (dx * dx + dz * dz) < EXIT_ZONE_RADIUS * EXIT_ZONE_RADIUS;
    }

    function getRandomWalkablePoint() {
      if (walkableList.length > 0) {
        for (let intento = 0; intento < 20; intento++) {
          const pt = walkableList[Math.floor(Math.random() * walkableList.length)];
          if (!isNearExit(pt.x, pt.z)) return pt;
        }
        return walkableList[Math.floor(Math.random() * walkableList.length)];
      }
      return { x: 7, z: -8 };
    }

    function getHeatAt(x, z) {
      const cx = Math.floor((x - heatMinX) / heatCellW);
      const cz = Math.floor((z - heatMinZ) / heatCellD);
      if (cx < 0 || cx >= HEAT_COLS || cz < 0 || cz >= HEAT_ROWS) return 0;
      return heatSmooth[cx + cz * HEAT_COLS];
    }

    function getSpeedFactorByHeat(x, z) {
      const density = getHeatAt(x, z);
      let t = density / DENSITY_MAX;
      if (t > 1) t = 1;
      if (t >= HEAT_SPEED_RED_T)    return 0.65;
      if (t >= HEAT_SPEED_ORANGE_T) return 0.75;
      if (t >= HEAT_SPEED_YELLOW_T) return 0.90;
      return 1.0;
    }

    function snapToNearestWalkable(x, z) {
      for (let r = 1; r <= 10; r++) {
        for (let dx = -r; dx <= r; dx++) {
          for (let dz = -r; dz <= r; dz++) {
            if (Math.abs(dx) !== r && Math.abs(dz) !== r) continue;
            const nx = x + dx * GRID_RES;
            const nz = z + dz * GRID_RES;
            if (isWalkable(nx, nz)) return { x: nx, z: nz };
          }
        }
      }
      return null;
    }

    /* ---------- MARCADOR DE MUERTE "X" ---------- */
    let _deathMarkerTexture = null;
    function getDeathMarkerTexture() {
      if (_deathMarkerTexture) return _deathMarkerTexture;

      const canvas = document.createElement('canvas');
      canvas.width  = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 128, 128);

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 28;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(30, 30); ctx.lineTo(98, 98);
      ctx.moveTo(98, 30); ctx.lineTo(30, 98);
      ctx.stroke();

      ctx.strokeStyle = '#ff0000';
      ctx.lineWidth = 18;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(30, 30); ctx.lineTo(98, 98);
      ctx.moveTo(98, 30); ctx.lineTo(30, 98);
      ctx.stroke();

      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 8;
      tex.needsUpdate = true;
      _deathMarkerTexture = tex;
      return tex;
    }

    function createDeathMarker() {
      const mat = new THREE.SpriteMaterial({
        map: getDeathMarkerTexture(),
        transparent: true,
        depthTest: true,
        depthWrite: false
      });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(0.55, 0.55, 1);
      sprite.position.set(0, 1.75, 0);
      return sprite;
    }

    /* ---------- MARCADOR DE ALERTA "!" ---------- */
    let _alertMarkerTexture = null;
    function getAlertMarkerTexture() {
      if (_alertMarkerTexture) return _alertMarkerTexture;
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#ffaa00';
      ctx.beginPath(); ctx.arc(64, 64, 52, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#ff2200';
      ctx.beginPath(); ctx.arc(64, 64, 44, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 68px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('!', 64, 62);

      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 8;
      tex.needsUpdate = true;
      _alertMarkerTexture = tex;
      return tex;
    }

    function createAlertMarker() {
      const mat = new THREE.SpriteMaterial({
        map: getAlertMarkerTexture(),
        transparent: true,
        depthTest: true,
        depthWrite: false
      });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(0.65, 0.65, 1);
      sprite.position.set(0, 1.7, 0);
      sprite.visible = false;
      return sprite;
    }

    function triggerAlertPerson(p) {
      if (p.isDead || p.state === 'evacuating') return;
      // Comportamiento estilo V3: pasar directamente a evacuando
      p.alerted = false;
      if (p.alertMarker) p.alertMarker.visible = false;
      p.state = 'evacuating';
      p.reactionDelay = 0.1 + Math.random() * 0.3;
      p.idleTime = 0;
    }

    function createPerson(x, z, color = 0x2266ff, workstation = null) {
      const group = new THREE.Group();

      const bodyGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.9, 12);
      const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.45;
      body.castShadow = true;

      const headGeo = new THREE.SphereGeometry(0.14, 12, 12);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.8 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 0.9 + 0.14;
      head.castShadow = true;

      group.add(body, head);

      const alertMarker = createAlertMarker();
      group.add(alertMarker);

      let px = x, pz = z;
      let rotY = Math.random() * Math.PI * 2;
      let isSitting = false;

      if (workstation) {
        px = workstation.seatPos.x;
        pz = workstation.seatPos.z;
        rotY = workstation.rotationY + Math.PI;
        isSitting = true;
        workstation.occupied = true;
      }

      group.position.set(px, isSitting ? 0.25 : 0, pz);
      group.rotation.y = rotY;
      scene.add(group);

      const personObj = {
        mesh: group,
        body: body,
        head: head,
        x: px,
        z: pz,
        workstation: workstation,
        speed: 0.8 + Math.random() * 0.6,
        animOffset: Math.random() * Math.PI * 2,
        idleTime: 0,
        stuckFrames: 0,
        state: isSitting ? 'sitting' : 'wandering',
        alerted: false,
        reactionDelay: 0,
        wanderAngle: rotY,
        wanderTimer: 1.0 + Math.random() * 2.0,
        dangerTimer: 0,
        isDead: false,
        deathMarker: null,
        alertMarker: alertMarker
      };

      people.push(personObj);
      return personObj;
    }

    function getRandomWalkablePointInRoom(roomObj) {
      if (!walkableList || walkableList.length === 0) return { x: 15, z: -10 };
      const candidates = walkableList.filter(pt =>
        pt.x >= roomObj.minX && pt.x <= roomObj.maxX &&
        pt.z >= roomObj.minZ && pt.z <= roomObj.maxZ &&
        !isNearExit(pt.x, pt.z)
      );
      if (candidates.length > 0) {
        return candidates[Math.floor(Math.random() * candidates.length)];
      }
      return { x: (roomObj.minX + roomObj.maxX) / 2, z: (roomObj.minZ + roomObj.maxZ) / 2 };
    }

    function clearPeople() {
      people.forEach(p => scene.remove(p.mesh));
      people.length = 0;
    }

    function spawnPeople(countGrande = null, countPequeno = null) {
      const rngG = document.getElementById('rng-cant-grande');
      const rngP = document.getElementById('rng-cant-pequeno');
      if (countGrande === null) countGrande = parseInt(rngG ? rngG.value : 8);
      if (countPequeno === null) countPequeno = parseInt(rngP ? rngP.value : 4);

      clearPeople();
      deathCount = 0;
      updateDeathCounter();

      workstations.forEach(ws => ws.occupied = false);

      // Salón Grande (Max 38)
      const wsGrande = workstations.filter(ws => ws.roomId === 'salon-grande');
      const freeGrande = [...wsGrande].sort(() => Math.random() - 0.5);
      for (let i = 0; i < countGrande; i++) {
        const color = PERSON_COLORS[i % PERSON_COLORS.length];
        if (i < freeGrande.length) {
          createPerson(freeGrande[i].seatPos.x, freeGrande[i].seatPos.z, color, freeGrande[i]);
        } else {
          const pt = getRandomWalkablePointInRoom(ROOMS[0]);
          createPerson(pt.x, pt.z, color, null);
        }
      }

      // Salón Pequeño (Max 16)
      const wsPequeno = workstations.filter(ws => ws.roomId === 'salon-pequeno');
      const freePequeno = [...wsPequeno].sort(() => Math.random() - 0.5);
      for (let i = 0; i < countPequeno; i++) {
        const color = PERSON_COLORS[(i + countGrande) % PERSON_COLORS.length];
        if (i < freePequeno.length) {
          createPerson(freePequeno[i].seatPos.x, freePequeno[i].seatPos.z, color, freePequeno[i]);
        } else {
          const pt = getRandomWalkablePointInRoom(ROOMS[2]);
          createPerson(pt.x, pt.z, color, null);
        }
      }

      // No activar alarma global: las personas reaccionan solo al humo o al contagio
      // (comportamiento tipo V3)
    }

    spawnPeople();
    updateDeathCounter();

    function removePerson(index) {
      scene.remove(people[index].mesh);
      people.splice(index, 1);
    }

    function killPerson(p) {
      if (p.isDead) return;
      p.isDead = true;
      p.state = 'dead';
      p.dangerTimer = DEATH_TIME_LIMIT;

      p.body.material.color.setHex(0x000000);
      p.head.material.color.setHex(0x000000);
      p.body.material.roughness = 1.0;
      p.head.material.roughness = 1.0;

      p.body.position.y = 0.45;
      p.head.position.y = 1.04;

      if (!p.deathMarker) {
        const marker = createDeathMarker();
        p.mesh.add(marker);
        p.deathMarker = marker;
      }

      deathCount++;
      updateDeathCounter();
    }

    function updatePeople(delta, time) {
      if (!isPeopleVisible) return;

      /* ---------- CONTAGIO DE EVACUACIÓN ---------- */
      if (evacuationMode) {
        for (let i = 0; i < people.length; i++) {
          const a = people[i];
          if (a.isDead || a.state !== 'evacuating') continue;
          for (let j = 0; j < people.length; j++) {
            if (i === j) continue;
            const b = people[j];
            if (b.isDead || b.state === 'evacuating') continue;
            const dx = a.x - b.x;
            const dz = a.z - b.z;
            if (dx * dx + dz * dz <= CONTAGION_RADIUS * CONTAGION_RADIUS) {
              b.state = 'evacuating';
              b.reactionDelay = 0.15 + Math.random() * 0.35;
              b.idleTime = 0;
              if (b.alertMarker) b.alertMarker.visible = false;
            }
          }
        }
      }

      for (let i = people.length - 1; i >= 0; i--) {
        const p = people[i];
        p.mesh.visible = isPeopleVisible;

        if (p.isDead) {
          if (p.deathMarker) {
            p.deathMarker.position.y = 1.75 + Math.sin(time * 2.0 + p.animOffset) * 0.06;
          }
          continue;
        }

        if (!isPeopleMoving) continue;

        /* ---------- Temporizador de muerte por recinto ---------- */
        const estadoRecinto = getRoomStatusAt(p.x, p.z);
        if (estadoRecinto === 'Muy Peligroso' || estadoRecinto === 'Mortal') {
          p.dangerTimer += delta * simSpeed;
          if (p.dangerTimer >= DEATH_TIME_LIMIT) {
            killPerson(p);
            continue;
          }
        } else {
          p.dangerTimer = 0;
        }

        const dangerFactor = getSpeedFactorByHeat(p.x, p.z);

        /* ---------- Disparadores de evacuación ---------- */
        if ((p.state === 'sitting' || p.state === 'wandering') && evacuationMode) {
          const heat = getHeatAt(p.x, p.z);
          const recintoPeligroso = (estadoRecinto === 'Peligroso' ||
                                    estadoRecinto === 'Muy Peligroso' ||
                                    estadoRecinto === 'Mortal');
          if (heat >= HUMO_THRESHOLD || recintoPeligroso) {
            if (p.reactionDelay <= 0) {
              p.reactionDelay = 0.2 + Math.random() * 0.6;
            }
            p.reactionDelay -= delta * simSpeed;
            if (p.reactionDelay <= 0) {
              p.state = 'evacuating';
              if (p.alertMarker) p.alertMarker.visible = false;
            }
          }
        }

        // ============================================
        // ESTADO: SITTING (sentados en la computadora)
        // ============================================
        if (p.state === 'sitting') {
          const typingAnim = Math.sin(time * 4.0 + p.animOffset);
          p.body.position.y = 0.45 + typingAnim * 0.01;
          p.head.position.y = 1.04 + typingAnim * 0.015;
          p.mesh.position.set(p.x, 0.25, p.z);
          continue;
        }

        // ============================================
        // ESTADO: WANDERING
        // ============================================
        if (p.state === 'wandering') {
          if (p.idleTime > 0) {
            p.idleTime -= delta * simSpeed;
            p.body.position.y = 0.45;
            p.head.position.y = 1.04;
            continue;
          }

          p.wanderTimer -= delta * simSpeed;
          if (p.wanderTimer <= 0) {
            p.wanderAngle = Math.random() * Math.PI * 2;
            p.wanderTimer = 1.5 + Math.random() * 2.5;
          }

          let diff = p.wanderAngle - p.mesh.rotation.y;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          p.mesh.rotation.y += diff * 0.10;

          const moveAngle = p.mesh.rotation.y;
          const step = p.speed * peopleSpeedMultiplier * 0.65 *
                       PERSON_BASE_SPEED_SCALE * dangerFactor * delta * simSpeed;
          const nextX = p.x + Math.sin(moveAngle) * step;
          const nextZ = p.z + Math.cos(moveAngle) * step;

          if (isWalkable(nextX, nextZ) && !isNearExit(nextX, nextZ)) {
            p.x = nextX;
            p.z = nextZ;
            p.mesh.position.set(p.x, 0, p.z);
            p.stuckFrames = 0;

            const walkCycle = Math.sin(time * 8 * p.speed + p.animOffset);
            p.body.position.y = 0.45 + Math.abs(walkCycle) * 0.05;
            p.head.position.y = 1.04 + Math.abs(walkCycle) * 0.05;
          } else {
            let found = false;
            for (let intento = 0; intento < 10; intento++) {
              const ang = Math.random() * Math.PI * 2;
              const tx = p.x + Math.sin(ang) * step;
              const tz = p.z + Math.cos(ang) * step;
              if (isWalkable(tx, tz) && !isNearExit(tx, tz)) {
                p.wanderAngle = ang;
                p.wanderTimer = 1.5 + Math.random() * 2.5;
                found = true;
                break;
              }
            }
            if (!found) {
              p.idleTime = 0.3 + Math.random() * 0.5;
            }
            p.stuckFrames++;
            if (p.stuckFrames > 60) {
              const snap = snapToNearestWalkable(p.x, p.z);
              if (snap) {
                p.x = snap.x;
                p.z = snap.z;
                p.mesh.position.set(p.x, 0, p.z);
              }
              p.stuckFrames = 0;
            }
          }
          continue;
        }

        // ============================================
        // ESTADO: EVACUATING
        // ============================================
        if (p.state === 'evacuating') {
          if (p.idleTime > 0) {
            p.idleTime -= delta * simSpeed;
            p.body.position.y = 0.45;
            p.head.position.y = 1.04;
            continue;
          }

          const dir = getFlowDirection(p.x, p.z);

          if (!dir) {
            p.idleTime = 0.3 + Math.random() * 0.4;
            if (!isWalkable(p.x, p.z)) {
              const snap = snapToNearestWalkable(p.x, p.z);
              if (snap) {
                p.x = snap.x; p.z = snap.z;
                p.mesh.position.set(p.x, 0, p.z);
              }
            }
            continue;
          }

          if (dir.arrived) {
            removePerson(i);
            continue;
          }

          const targetAngle = Math.atan2(dir.x, dir.z);
          let diff = targetAngle - p.mesh.rotation.y;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          p.mesh.rotation.y += diff * 0.15;

          const step = p.speed * peopleSpeedMultiplier *
                       PERSON_BASE_SPEED_SCALE * dangerFactor * delta * simSpeed;
          const moveAngle = p.mesh.rotation.y;
          const nextX = p.x + Math.sin(moveAngle) * step;
          const nextZ = p.z + Math.cos(moveAngle) * step;

          if (isWalkable(nextX, nextZ)) {
            p.x = nextX; p.z = nextZ;
            p.mesh.position.set(p.x, 0, p.z);
            p.stuckFrames = 0;

            const walkCycle = Math.sin(time * 10 * p.speed + p.animOffset);
            p.body.position.y = 0.45 + Math.abs(walkCycle) * 0.05;
            p.head.position.y = 1.04 + Math.abs(walkCycle) * 0.05;
          } else {
            const sx = p.x + dir.x * step;
            const sz = p.z + dir.z * step;
            if (isWalkable(sx, sz)) {
              p.x = sx; p.z = sz;
              p.mesh.position.set(p.x, 0, p.z);
              p.stuckFrames = 0;
            } else {
              p.stuckFrames++;
              if (p.stuckFrames > 25 && p.stuckFrames % 25 === 0) {
                const a = Math.random() * Math.PI * 2;
                const nx = p.x + Math.cos(a) * 0.5;
                const nz = p.z + Math.sin(a) * 0.5;
                if (isWalkable(nx, nz)) {
                  p.x = nx; p.z = nz;
                  p.mesh.position.set(p.x, 0, p.z);
                }
                p.stuckFrames = 0;
              }
            }
          }
          continue;
        }
      }
    }

    /* ---------- Motor de incendio ---------- */
    function createFireSystem(x, z) {
      const origin = new THREE.Vector3(x, 0.2, z);

      const light = new THREE.PointLight(0xff4400, 0.3, 8, 2);
      light.position.set(origin.x, 0.8, origin.z);
      light.castShadow = !IS_MOBILE; // sin sombras de fuego en móvil
      scene.add(light);

      const flameCount = IS_MOBILE ? 80 : 150;
      const flameGeo = new THREE.BufferGeometry();
      const flamePos = new Float32Array(flameCount * 3);
      const flameSpeeds = [];
      for (let i = 0; i < flameCount; i++) {
        flamePos[i*3]   = origin.x + (Math.random() - 0.5) * 0.5;
        flamePos[i*3+1] = Math.random() * 1.0;
        flamePos[i*3+2] = origin.z + (Math.random() - 0.5) * 0.5;
        flameSpeeds.push(0.015 + Math.random() * 0.02);
      }
      flameGeo.setAttribute('position', new THREE.BufferAttribute(flamePos, 3));
      const flameMat = new THREE.PointsMaterial({ color:0xff3700, size:0.23, transparent:true, opacity:0.8 });
      const flames = new THREE.Points(flameGeo, flameMat);
      flames.layers.set(1);
      scene.add(flames);

      const smokeGeo = new THREE.BufferGeometry();
      const smokePos = new Float32Array(MAX_SMOKE * 3);
      const smokeVel = [];
      for (let i = 0; i < MAX_SMOKE; i++) {
        smokePos[i*3]   = origin.x;
        smokePos[i*3+1] = -9999;
        smokePos[i*3+2] = origin.z;
        const angle = Math.random() * Math.PI * 2;
        const spreadSpeed = 0.014 + Math.random() * 0.028;
        smokeVel.push({
          vx: Math.cos(angle) * spreadSpeed,
          vy: 0.010 + Math.random() * 0.014,
          vz: Math.sin(angle) * spreadSpeed,
          cooling: false,
          cool: 0.00016 + Math.random() * 0.00020
        });
      }
      smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));

      const smokeMat = new THREE.PointsMaterial({
        color:0x1a1a1a, size:0.33, transparent:true, opacity:0.25, depthWrite:false
      });
      const smoke = new THREE.Points(smokeGeo, smokeMat);
      smoke.visible = false;
      smoke.frustumCulled = false;
      smoke.layers.set(1);
      scene.add(smoke);

      const sArr = smokeGeo.attributes.position.array;
      const fArr = flameGeo.attributes.position.array;
      const accel = Math.pow(1.0015, SMOKE_STRIDE);
      let phase = 0;

      return {
        origin, active:true, activeSmokeCount:0, spawnAccumulator:0, smokeArray:sArr,
        toggle(state) {
          this.active = state;
          light.visible = state;
          flames.visible = state;
          if (!state && this.activeSmokeCount === 0) smoke.visible = false;
        },
        clearSmoke() {
          for (let i = 0; i < MAX_SMOKE; i++) {
            sArr[i*3] = 0; sArr[i*3+1] = -9999; sArr[i*3+2] = 0;
            smokeVel[i].cooling = false;
          }
          smokeGeo.attributes.position.needsUpdate = true;
          this.activeSmokeCount = 0;
          this.spawnAccumulator = 0;
          smoke.visible = false;
        },
        update(time) {
          if (this.active) {
            light.intensity = 0.2 + Math.sin(time*15*simSpeed + origin.x)*0.1 + Math.random()*0.1;
            for (let i = 0; i < flameCount; i++) {
              fArr[i*3+1] += flameSpeeds[i] * simSpeed;
              if (fArr[i*3+1] > 1.0) {
                fArr[i*3+1] = 0.1;
                fArr[i*3]   = origin.x + (Math.random()-0.5)*0.5;
                fArr[i*3+2] = origin.z + (Math.random()-0.5)*0.5;
              }
            }
            flameGeo.attributes.position.needsUpdate = true;

            if (isSmokeGenerating) {
              this.spawnAccumulator += (1.5 * VELOCIDAD_HUMO) * simSpeed;
              const n = Math.floor(this.spawnAccumulator);
              this.spawnAccumulator -= n;
              for (let s = 0; s < n; s++) {
                if (this.activeSmokeCount < MAX_SMOKE) {
                  const idx = this.activeSmokeCount * 3;
                  sArr[idx]   = origin.x + (Math.random()-0.5)*0.5;
                  sArr[idx+1] = SMOKE_SPAWN_Y;
                  sArr[idx+2] = origin.z + (Math.random()-0.5)*0.5;
                  smokeVel[this.activeSmokeCount].cooling = false;
                  this.activeSmokeCount++;
                }
              }
            }
          }
          smoke.visible = this.activeSmokeCount > 0;

          const ceilingLimit = TECHO_HUMO;
          phase = (phase + 1) % SMOKE_STRIDE;
          const step = simSpeed * SMOKE_STRIDE * VELOCIDAD_HUMO;

          for (let i = phase; i < this.activeSmokeCount; i += SMOKE_STRIDE) {
            const idx = i * 3;
            if (sArr[idx+1] > -100) {
              let nextX = sArr[idx];
              let nextZ = sArr[idx+2];
              if (!smokeVel[i].cooling) {
                sArr[idx+1] += smokeVel[i].vy * step;
                nextX += (Math.random()-0.5) * 0.01 * step;
                nextZ += (Math.random()-0.5) * 0.01 * step;
                if (sArr[idx+1] >= ceilingLimit) {
                  sArr[idx+1] = ceilingLimit;
                  smokeVel[i].cooling = true;
                }
              } else {
                smokeVel[i].vx = Math.max(-0.02, Math.min(0.02, smokeVel[i].vx * accel));
                smokeVel[i].vz = Math.max(-0.02, Math.min(0.02, smokeVel[i].vz * accel));
                nextX += smokeVel[i].vx * step;
                nextZ += smokeVel[i].vz * step;
                sArr[idx+1] -= smokeVel[i].cool * step;
              }

              const prevX = sArr[idx];
              const prevZ = sArr[idx + 2];
              let blocked = false;
              if (collisionGrid) {
                const gX = Math.floor((nextX - gridMinX) / GRID_RES);
                const gZ = Math.floor((nextZ - gridMinZ) / GRID_RES);
                if (gX >= 0 && gX < gridStepsX && gZ >= 0 && gZ < gridStepsZ) {
                  if (collisionGrid[gX + gZ * gridStepsX] === 1) blocked = true;
                }
              }
              if (!blocked && wouldHitBarrier(prevX, prevZ, nextX, nextZ)) blocked = true;

              if (blocked) {
                smokeVel[i].vx *= -0.5;
                smokeVel[i].vz *= -0.5;
                smokeVel[i].vx += (Math.random()-0.5)*0.02;
                smokeVel[i].vz += (Math.random()-0.5)*0.02;
                nextX = sArr[idx];
                nextZ = sArr[idx+2];
              }

              sArr[idx]   = nextX;
              sArr[idx+2] = nextZ;
              if (sArr[idx+1] < SMOKE_FLOOR)  sArr[idx+1] = SMOKE_FLOOR;
              if (sArr[idx+1] > ceilingLimit) sArr[idx+1] = ceilingLimit;
            }
          }
          smokeGeo.attributes.position.needsUpdate = true;
        }
      };
    }

    const fires = [
      createFireSystem(17, -11),
      createFireSystem(9, -8),
      createFireSystem(1, -5)
    ];

    fires.forEach(f => f.toggle(false));

    document.getElementById('chk-foco1').addEventListener('change', e => fires[0].toggle(e.target.checked));
    document.getElementById('chk-foco2').addEventListener('change', e => fires[1].toggle(e.target.checked));
    document.getElementById('chk-foco3').addEventListener('change', e => fires[2].toggle(e.target.checked));
    document.getElementById('btn-limpiar').addEventListener('click', () => fires.forEach(f => f.clearSmoke()));

    const btnDetenerHumo = document.getElementById('btn-detener-humo');
    btnDetenerHumo.addEventListener('click', () => {
      isSmokeGenerating = !isSmokeGenerating;
      if (isSmokeGenerating) {
        btnDetenerHumo.innerText = "Detener Humo";
        btnDetenerHumo.classList.remove("stopped");
      } else {
        btnDetenerHumo.innerText = "Reanudar Humo";
        btnDetenerHumo.classList.add("stopped");
      }
    });

    /* ---------- Eventos de UI ---------- */
    const chkPersonas = document.getElementById('chk-personas');
    const chkMovimiento = document.getElementById('chk-movimiento');
    const chkEvacuacion = document.getElementById('chk-evacuacion');
    const chkVentanas = document.getElementById('chk-ventanas');
    const rngGrande = document.getElementById('rng-cant-grande');
    const lblGrande = document.getElementById('lbl-cant-grande');
    const rngPequeno = document.getElementById('rng-cant-pequeno');
    const lblPequeno = document.getElementById('lbl-cant-pequeno');
    const rngVel = document.getElementById('rng-personas-vel');
    const lblVel = document.getElementById('lbl-personas-vel');
    const btnResetPersonas = document.getElementById('btn-reset-personas');

    if (chkPersonas) {
      chkPersonas.addEventListener('change', (e) => {
        isPeopleVisible = e.target.checked;
        people.forEach(p => p.mesh.visible = isPeopleVisible);
      });
    }

    if (chkMovimiento) {
      chkMovimiento.addEventListener('change', (e) => {
        isPeopleMoving = e.target.checked;
      });
    }

    if (chkEvacuacion) {
      chkEvacuacion.addEventListener('change', (e) => {
        evacuationMode = e.target.checked;
        people.forEach(p => {
          if (p.isDead) return;
          p.state = 'wandering';
          p.reactionDelay = 0;
          if (evacuationMode) {
            p.wanderAngle = Math.random() * Math.PI * 2;
            p.wanderTimer = 1.0 + Math.random() * 2.0;
          }
        });
      });
    }

    if (chkVentanas) {
      chkVentanas.addEventListener('change', (e) => {
        windowsOpen = e.target.checked;
      });
    }

    if (rngGrande) {
      rngGrande.addEventListener('input', (e) => {
        const c = parseInt(e.target.value);
        if (lblGrande) lblGrande.textContent = c;
        spawnPeople(c, parseInt(rngPequeno ? rngPequeno.value : 4));
      });
    }

    if (rngPequeno) {
      rngPequeno.addEventListener('input', (e) => {
        const c = parseInt(e.target.value);
        if (lblPequeno) lblPequeno.textContent = c;
        spawnPeople(parseInt(rngGrande ? rngGrande.value : 8), c);
      });
    }

    if (rngVel) {
      rngVel.addEventListener('input', (e) => {
        peopleSpeedMultiplier = parseFloat(e.target.value);
        if (lblVel) lblVel.textContent = peopleSpeedMultiplier.toFixed(1) + 'x';
      });
    }

    if (btnResetPersonas) {
      btnResetPersonas.addEventListener('click', () => {
        const cG = parseInt(rngGrande ? rngGrande.value : 8);
        const cP = parseInt(rngPequeno ? rngPequeno.value : 4);
        spawnPeople(cG, cP);
      });
    }

    /* ---------- Mapa de calor ---------- */
    const colorGreen  = new THREE.Color(0xa8e6a8);
    const colorYellow = new THREE.Color(0xffeb3b);
    const colorRed    = new THREE.Color(0xf44336);
    const tempColor   = new THREE.Color();

    const floorPositions = floorGeo.attributes.position.array;
    const floorColors    = floorGeo.attributes.color.array;

    const HEAT_COLS = 80, HEAT_ROWS = 80, DENSITY_MAX = 15;
    const heatDensity = new Float32Array(HEAT_COLS * HEAT_ROWS);
    const heatSmooth  = new Float32Array(HEAT_COLS * HEAT_ROWS);
    const heatMinX  = floorCenterX - floorWidth / 2;
    const heatMinZ  = floorCenterZ - floorDepth / 2;
    const heatCellW = floorWidth  / HEAT_COLS;
    const heatCellD = floorDepth  / HEAT_ROWS;

    function computeDensity() {
      heatDensity.fill(0);
      for (let f = 0; f < fires.length; f++) {
        const fire = fires[f];
        if (!fire.active && fire.activeSmokeCount === 0) continue;
        const sArr = fire.smokeArray;
        const count = fire.activeSmokeCount;
        for (let i = 0; i < count; i++) {
          const idx = i * 3;
          const px = sArr[idx], pz = sArr[idx+2];
          if (px < heatMinX || px >= heatMinX + floorWidth)  continue;
          if (pz < heatMinZ || pz >= heatMinZ + floorDepth)  continue;
          const cx = ((px - heatMinX) / heatCellW) | 0;
          const cz = ((pz - heatMinZ) / heatCellD) | 0;
          if (cx >= 0 && cx < HEAT_COLS && cz >= 0 && cz < HEAT_ROWS)
            heatDensity[cx + cz * HEAT_COLS]++;
        }
      }
      for (let z = 1; z < HEAT_ROWS - 1; z++)
        for (let x = 1; x < HEAT_COLS - 1; x++) {
          const i = x + z * HEAT_COLS;
          heatSmooth[i] = (heatDensity[i]*4 +
            heatDensity[i-1] + heatDensity[i+1] +
            heatDensity[i-HEAT_COLS] + heatDensity[i+HEAT_COLS]) / 8;
        }
      for (let x = 0; x < HEAT_COLS; x++) {
        heatSmooth[x] = heatDensity[x];
        heatSmooth[x + (HEAT_ROWS-1)*HEAT_COLS] = heatDensity[x + (HEAT_ROWS-1)*HEAT_COLS];
      }
      for (let z = 0; z < HEAT_ROWS; z++) {
        heatSmooth[z*HEAT_COLS] = heatDensity[z*HEAT_COLS];
        heatSmooth[(HEAT_COLS-1) + z*HEAT_COLS] = heatDensity[(HEAT_COLS-1) + z*HEAT_COLS];
      }
    }

    function updateHeatmap() {
      for (let i = 0; i < vertexCount; i++) {
        const vx = floorPositions[i*3];
        const vz = floorPositions[i*3+2];
        let cx = ((vx - heatMinX) / heatCellW) | 0;
        let cz = ((vz - heatMinZ) / heatCellD) | 0;
        if (cx < 0) cx = 0; else if (cx >= HEAT_COLS) cx = HEAT_COLS - 1;
        if (cz < 0) cz = 0; else if (cz >= HEAT_ROWS) cz = HEAT_ROWS - 1;
        const density = heatSmooth[cx + cz * HEAT_COLS];
        let t = density / DENSITY_MAX; if (t > 1) t = 1;
        if (t > 0.5) {
          const u = (t - 0.5) * 2.0;
          tempColor.lerpColors(colorYellow, colorRed, u);
        } else {
          const u = t * 2.0;
          tempColor.lerpColors(colorGreen, colorYellow, u);
        }
        floorColors[i*3]   = tempColor.r * HEATMAP_INTENSITY;
        floorColors[i*3+1] = tempColor.g * HEATMAP_INTENSITY;
        floorColors[i*3+2] = tempColor.b * HEATMAP_INTENSITY;
      }
      floorGeo.attributes.color.needsUpdate = true;
    }

    function updateRoomStatus() {
      for (let r = 0; r < ROOMS.length; r++) {
        const room = ROOMS[r];
        let cx0 = Math.max(0, Math.floor((room.minX - heatMinX) / heatCellW));
        let cx1 = Math.min(HEAT_COLS, Math.ceil((room.maxX - heatMinX) / heatCellW));
        let cz0 = Math.max(0, Math.floor((room.minZ - heatMinZ) / heatCellD));
        let cz1 = Math.min(HEAT_ROWS, Math.ceil((room.maxZ - heatMinZ) / heatCellD));
        if (cx1 <= cx0 || cz1 <= cz0) continue;

        let greenCount = 0, yellowCount = 0, redCount = 0, total = 0, totalDensity = 0;
        for (let z = cz0; z < cz1; z++)
          for (let x = cx0; x < cx1; x++) {
            const density = heatSmooth[x + z * HEAT_COLS];
            let t = density / DENSITY_MAX; if (t > 1) t = 1;
            totalDensity += density;
            if (t >= ROOM_RED_T)         redCount++;
            else if (t >= ROOM_YELLOW_T) yellowCount++;
            else                         greenCount++;
            total++;
          }

        let estado = 'Normal';
        if (total > 0) {
          const redPct  = redCount / total;
          const warmPct = (yellowCount + redCount) / total;
          const avgDens = totalDensity / total;

          const limiteRedPct    = room.redPct     || ROOM_RED_PCT;
          const limiteMortal    = room.avgMortal  || ROOM_AVG_MORTAL;
          const limiteVdRedPct  = room.vdRedPct   || ROOM_VD_RED_PCT;
          const limiteVdWarmPct = room.vdWarmPct  || ROOM_VD_WARM_PCT;
          const limiteVDanger   = room.avgVDanger || ROOM_AVG_VDANGER;
          const limiteWarmPct   = room.warmPct    || ROOM_WARM_PCT;
          const limitePeligro   = room.avgDanger  || ROOM_AVG_DANGER;

          if (redPct >= limiteRedPct || avgDens >= limiteMortal) estado = 'Mortal';
          else if (redPct >= limiteVdRedPct || warmPct >= limiteVdWarmPct || avgDens >= limiteVDanger)
            estado = 'Muy Peligroso';
          else if (warmPct >= limiteWarmPct || avgDens >= limitePeligro)
            estado = 'Peligroso';
        }

        room.estado = estado;

        const el = document.getElementById(room.id);
        if (el) {
          if (el.textContent !== estado) el.textContent = estado;
          const cls = 'estado-' + estado.toLowerCase().replace(/\s+/g, '-');
          if (el.className !== cls) el.className = cls;
        }
      }
    }

    /* ---------- Loop principal ---------- */
    const clock = new THREE.Clock();
    let frameCounter = 0, roomFrameCounter = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);
      const time  = clock.elapsedTime;

      for (let i = 0; i < fires.length; i++) fires[i].update(time);
      updatePeople(delta, time);

      if (frameCounter % HEATMAP_EVERY === 0) { computeDensity(); updateHeatmap(); }
      frameCounter++;

      if (roomFrameCounter % ROOM_STATUS_EVERY === 0) updateRoomStatus();
      roomFrameCounter++;

      controls.update();

      renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
      renderer.setScissorTest(false);
      renderer.render(scene, camera);

      const marco = document.getElementById('minimapa-marco');
      const rect = marco.getBoundingClientRect();
      if (rect.width > 4 && rect.height > 4) {
        const mapY = window.innerHeight - rect.bottom;
        renderer.setViewport(rect.left, mapY, rect.width, rect.height);
        renderer.setScissor(rect.left, mapY, rect.width, rect.height);
        renderer.setScissorTest(true);

        const bgOriginal = scene.background;
        scene.background = new THREE.Color(0x1a1a1a);
        renderer.render(scene, mapCamera);
        scene.background = bgOriginal;

        renderer.setScissorTest(false);
      }
    }
    animate();

    /* ---------- Resize ---------- */
    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', () => {
      // Pequeño delay: algunos navegadores móviles tardan en actualizar las dimensiones
      setTimeout(onResize, 250);
    });

    // Cerrar menú con tecla Escape (útil en tablet con teclado)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') toggleMenu(false);
    });
  </script>
</body>
