<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Simulador de Incendio - Propagación Realista por Puertas</title>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body {
      margin: 0; overflow: hidden; background-color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    canvas { display: block; touch-action: none; }

    #btn-menu {
      display: none;
      position: fixed;
      top: 10px; left: 10px;
      width: 46px; height: 46px;
      background: rgba(0,0,0,0.88);
      color: #fff;
      border: 2px solid rgba(255,150,0,0.65);
      border-radius: 10px;
      font-size: 22px;
      cursor: pointer;
      z-index: 101;
      align-items: center;
      justify-content: center;
      user-select: none; -webkit-user-select: none;
      transition: background 0.2s, transform 0.1s;
    }
    #btn-menu:active { transform: scale(0.94); background: #ff5500; }

    #ui-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 99;
    }

    #ui {
      position: absolute; top: 15px; left: 15px; color: #fff;
      background: rgba(0,0,0,0.85); padding: 15px 20px; border-radius: 8px;
      font-size: 14px; line-height: 1.6; width: 260px;
    }
    .control-group { margin-top: 10px; }
    label { cursor: pointer; display: block; margin-bottom: 5px; transition: 0.2s; }
    label:hover { color: #ff5500; }
    input[type="checkbox"] { margin-right: 8px; cursor: pointer; }
    input[type="range"] { cursor: pointer; accent-color: #ff5500; }
    hr { border: 0; border-top: 1px solid #555; margin: 12px 0; }
    .action-btn {
      margin-top: 10px; width: 100%; padding: 8px; background-color: #444;
      color: white; border: 1px solid #666; border-radius: 4px;
      cursor: pointer; font-weight: bold; transition: background 0.2s;
    }
    .action-btn:hover { background-color: #d93600; border-color: #ff5500; }
    .action-btn.active {
      background-color: #ff5500;
      border-color: #ff8800;
      box-shadow: 0 0 10px rgba(255,85,0,0.75);
      animation: pulsoFoco 1.2s ease-in-out infinite;
    }
    @keyframes pulsoFoco {
      0%, 100% { box-shadow: 0 0 6px rgba(255,85,0,0.55); }
      50%      { box-shadow: 0 0 14px rgba(255,85,0,1); }
    }
    .action-btn.btn-danger { background-color: #5c1a1a; border-color: #8b2b2b; }
    .action-btn.btn-danger:hover { background-color: #8b2b2b; border-color: #d93600; }
    #btn-detener-humo.stopped { background-color: #ff5500; border-color: #ff7700; }

    #contador-muertes {
      margin-top: 4px;
      font-size: 26px; font-weight: bold; text-align: center;
      color: #ff4444; letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(255,0,0,0.6);
    }

    #victimas-movil { display: none; }

    #tabla-seguridad {
      position: absolute; top: 15px; right: 15px; color: #fff;
      background: rgba(0,0,0,0.85); padding: 12px 15px; border-radius: 8px;
      font-size: 14px; min-width: 240px;
    }
    #tabla-seguridad h3 { margin: 0 0 8px 0; font-size: 14px; color: #ff9955; letter-spacing: 0.5px; }
    #tabla-seguridad table { width: 100%; border-collapse: collapse; }
    #tabla-seguridad th, #tabla-seguridad td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #444; }
    #tabla-seguridad th { color: #ccc; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    #tabla-seguridad td.estado-normal        { color: #4fff4f; font-weight: bold; }
    #tabla-seguridad td.estado-peligroso     { color: #ffdd33; font-weight: bold; }
    #tabla-seguridad td.estado-muy-peligroso { color: #ff8800; font-weight: bold; }
    #tabla-seguridad td.estado-mortal        { color: #ff4444; font-weight: bold; }

    #minimapa-marco {
      position: absolute; bottom: 15px; right: 15px;
      width: 280px; height: 280px;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 8px; overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8);
      pointer-events: none; z-index: 10;
    }
    #minimapa-titulo {
      background: rgba(0,0,0,0.85); color: #ff9955;
      font-size: 12px; font-weight: bold; text-align: center;
      padding: 6px 0; text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid #444;
    }

    @media (max-width: 768px), (pointer: coarse) and (max-width: 900px) {
      #btn-menu { display: flex; }

      #ui { display: none; }

      body.ui-open #ui-overlay { display: block; }

      body.ui-open #ui {
        display: block;
        position: fixed;
        top: 62px; left: 8px; right: 8px;
        bottom: auto;
        width: auto;
        max-height: calc(100vh - 176px);
        max-height: calc(100dvh - 176px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        z-index: 100;
        font-size: 13px;
        padding: 12px 14px 18px;
        line-height: 1.5;
        scrollbar-width: thin;
        scrollbar-color: #ff5500 rgba(255,255,255,0.12);
      }
      body.ui-open #ui::-webkit-scrollbar { width: 6px; }
      body.ui-open #ui::-webkit-scrollbar-track { background: rgba(255,255,255,0.12); border-radius: 3px; }
      body.ui-open #ui::-webkit-scrollbar-thumb { background: #ff5500; border-radius: 3px; }

      body.ui-open input[type="checkbox"] { width: 18px; height: 18px; vertical-align: middle; }
      body.ui-open label { padding: 5px 0; font-size: 14px; margin-bottom: 3px; }
      body.ui-open .action-btn {
        padding: 11px 0; font-size: 13px; min-height: 42px;
      }
      body.ui-open input[type="range"] { min-height: 26px; width: 100% !important; }
      body.ui-open hr { margin: 10px 0; }

      #tabla-seguridad {
        position: fixed;
        top: 10px; right: 10px;
        left: auto; bottom: auto;
        width: auto;
        min-width: 0;
        max-width: 60vw;
        z-index: 50;
        font-size: 11px;
        padding: 8px 10px;
        line-height: 1.3;
      }
      #tabla-seguridad h3 { font-size: 11px; margin-bottom: 5px; }
      #tabla-seguridad th, #tabla-seguridad td { padding: 3px 5px; font-size: 11px; }
      #tabla-seguridad th { font-size: 9px; }

      body.ui-open #tabla-seguridad,
      body.ui-open #minimapa-marco { display: none; }

      #minimapa-marco {
        width: 128px; height: 128px;
        bottom: 8px; right: 8px;
        top: auto; left: auto;
        border-width: 1px;
        z-index: 49;
      }
      #minimapa-titulo { font-size: 10px; padding: 4px 0; }

      .action-btn { font-size: 12px; }

      .victimas-section { display: none; }

      #victimas-movil {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        left: 8px; bottom: 8px;
        min-width: 104px;
        padding: 6px 14px 8px;
        background: rgba(0,0,0,0.88);
        border: 1px solid rgba(255,85,0,0.6);
        border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.7);
        z-index: 102;
        pointer-events: none;
        text-align: center;
      }
      #victimas-movil-titulo {
        font-size: 10px; font-weight: bold;
        letter-spacing: 1px; text-transform: uppercase;
        color: #ff9955;
      }
      #contador-muertes-movil {
        font-size: 24px; font-weight: bold; line-height: 1.1;
        color: #ff4444; letter-spacing: 1px;
        text-shadow: 0 0 8px rgba(255,0,0,0.6);
      }
    }

    @media (max-width: 400px) {
      #minimapa-marco { width: 108px; height: 108px; }
      #tabla-seguridad { font-size: 10px; padding: 6px 8px; }
      #tabla-seguridad td { padding: 2px 4px; }
    }
  </style>
</head>
<body>
  <button id="btn-menu" type="button" aria-label="Menú">☰</button>
  <div id="ui-overlay"></div>

  <div id="ui">
    <strong>Focos de Incendio</strong>
    <div class="control-group">
      <button id="btn-generar-incendio" class="action-btn">Generar Incendio</button>
      <button id="btn-quitar-incendios" class="action-btn btn-danger">Quitar Incendios</button>
    </div>
    <hr>
    <strong>Velocidad de Simulación</strong>
    <div style="margin-top: 6px;">
      <label style="display:flex; justify-content:space-between; margin-bottom: 2px;">
        <span>Velocidad:</span> <span id="lbl-sim-vel">1.0x</span>
      </label>
      <input type="range" id="rng-sim-vel" min="0.5" max="8.0" step="0.5" value="1.0" style="width: 100%;">
    </div>
    <hr>
    <strong>Ventilación</strong>
    <div class="control-group">
      <label><input type="checkbox" id="chk-auto-romper" checked> Romper vidrios si es Mortal</label>
    </div>
    <button id="btn-reparar-vidrios" class="action-btn" style="background-color: #1b5e20; border-color: #388e3c;">Reparar Vidrios</button>
    <hr>
    <button id="btn-detener-humo" class="action-btn">Detener Humo</button>
    <button id="btn-limpiar" class="action-btn">Limpiar Humo y Enfriar</button>
    <hr>
    <strong>Personas</strong>
    <div class="control-group">
      <label><input type="checkbox" id="chk-personas" checked> Mostrar Personas</label>
      <label><input type="checkbox" id="chk-movimiento" checked> Habilitar Movimiento</label>
      <label><input type="checkbox" id="chk-evacuacion" checked> Evacuar al detectar humo</label>
      <div style="margin-top: 8px;">
        <label style="display:flex; justify-content:space-between; margin-bottom: 2px;">
          <span>Laboratorio Rojo (Max 38):</span> <span id="lbl-cant-rojo">8</span>
        </label>
        <input type="range" id="rng-cant-rojo" min="0" max="38" value="8" style="width: 100%;">
      </div>
      <div style="margin-top: 8px;">
        <label style="display:flex; justify-content:space-between; margin-bottom: 2px;">
          <span>Laboratorio Verde (Max 16):</span> <span id="lbl-cant-verde">4</span>
        </label>
        <input type="range" id="rng-cant-verde" min="0" max="16" value="4" style="width: 100%;">
      </div>
      <div style="margin-top: 8px;">
        <label style="display:flex; justify-content:space-between; margin-bottom: 2px;">
          <span>Laboratorio Naranja (Max 11):</span> <span id="lbl-cant-naranja">4</span>
        </label>
        <input type="range" id="rng-cant-naranja" min="0" max="11" value="4" style="width: 100%;">
      </div>
      <div style="margin-top: 8px;">
        <label style="display:flex; justify-content:space-between; margin-bottom: 2px;">
          <span>Laboratorio Azul (Max 47):</span> <span id="lbl-cant-azul">4</span>
        </label>
        <input type="range" id="rng-cant-azul" min="0" max="47" value="4" style="width: 100%;">
      </div>
    </div>
    <button id="btn-reset-personas" class="action-btn" style="margin-top: 8px;">Reubicar en Computadoras</button>
    <div class="victimas-section">
      <hr>
      <strong>Víctimas</strong>
      <div id="contador-muertes">0</div>
    </div>
  </div>

  <div id="victimas-movil">
    <div id="victimas-movil-titulo">Víctimas</div>
    <div id="contador-muertes-movil">0</div>
  </div>

  <div id="tabla-seguridad">
    <h3>Estado de Seguridad</h3>
    <table>
      <thead>
        <tr><th>Ubicación</th><th>Seguridad</th></tr>
      </thead>
      <tbody>
        <tr><td>Laboratorio Rojo</td>   <td id="estado-rojo"  class="estado-normal">Normal</td></tr>
        <tr><td>Pasillo</td>            <td id="estado-pasillo"       class="estado-normal">Normal</td></tr>
        <tr><td>Laboratorio Verde</td>  <td id="estado-verde" class="estado-normal">Normal</td></tr>
        <tr><td>Laboratorio Naranja</td><td id="estado-naranja" class="estado-normal">Normal</td></tr>
        <tr><td>Laboratorio Azul</td>   <td id="estado-azul" class="estado-normal">Normal</td></tr>
      </tbody>
    </table>
  </div>

  <div id="minimapa-marco">
    <div id="minimapa-titulo">MAPA DE CALOR</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches ||
                      /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    let simSpeed = 1.0;
    let isSmokeGenerating = true;
    let firePlacementMode = false;

    /* PARÁMETROS FÍSICOS (SI) */
    const TECHO_HUMO           = 2.55;
    const MAX_SMOKE            = IS_MOBILE ? 2500 : 6000;
    const SMOKE_FLOOR          = 0.6;
    const SMOKE_SPAWN_Y        = 0.7;
    const SMOKE_STRIDE         = 4;
    const HEATMAP_INTENSITY    = 0.45;
    const HEATMAP_EVERY        = IS_MOBILE ? 3 : 2;
    const PLUME_RISE_MIN       = 1.0;
    const PLUME_RISE_MAX       = 3.0;
    const SMOKE_SPREAD_MIN     = 0.3;
    const SMOKE_SPREAD_MAX     = 1.0;
    const LAYER_DESCENT_MIN    = 0.01;
    const LAYER_DESCENT_MAX    = 0.03;
    const SMOKE_EMISSION_RATE  = 48;
    const SMOKE_LATERAL_JITTER = 0.20;
    const FLAME_RISE_MIN       = 1.0;
    const FLAME_RISE_MAX       = 2.5;
    const FLAME_TOP            = 1.0;

    const HUMO_THRESHOLD     = 0.8;
    const SMOKE_SAFE_DENSITY = 0.5;
    const SMOKE_FED_TIME     = 30.0;

    const ROOM_STATUS_EVERY = 1;
    const ROOM_RED_T        = 0.30;
    const ROOM_YELLOW_T     = 0.08;
    const ROOM_RED_PCT      = 0.28;
    const ROOM_AVG_MORTAL   = 12;
    const ROOM_VD_RED_PCT   = 0.15;
    const ROOM_VD_WARM_PCT  = 0.35;
    const ROOM_AVG_VDANGER  = 8;
    const ROOM_WARM_PCT     = 0.10;
    const ROOM_AVG_DANGER   = 2;

    const WALK_SPEED_MEAN     = 2.50;
    const WALK_SPEED_SD       = 0.60;
    const WALK_SPEED_MIN      = 1.50;
    const WALK_SPEED_MAX      = 4.00;
    const WANDER_SPEED_FACTOR = 0.65;
    const CONTAGION_RADIUS    = 0.9;
    const CONTAGION_DELAY_MIN = 1.0;
    const CONTAGION_DELAY_MAX = 3.0;
    const PREMOVEMENT_MEDIAN_NOALARM = 20.0;
    const PREMOVEMENT_MEDIAN_ALARM   = 6.0;
    const PREMOVEMENT_SIGMA   = 0.6;
    const PREMOVEMENT_MIN_T   = 2.0;
    const PREMOVEMENT_MAX_T   = 180.0;

    const VIS_BREAKS  = [0.10, 0.25, 0.45, 0.70];
    const VIS_FACTORS = [1.00, 0.80, 0.60, 0.40, 0.20];

    const PERSON_COLLISION_R   = 0.28;
    const CONFUSION_CHANCE     = 0.03;
    const CONFUSION_TIME_MIN   = 2.5;
    const CONFUSION_TIME_MAX   = 6.0;
    const CONFUSION_SAFE_R     = 3.5;
    const CONFUSION_COOLDOWN   = 6.0;
    const LAB_ROOM_IDX_S       = [0, 2, 3, 4];

    function gaussianRandom() {
      let u = 0, v = 0;
      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function sampleWalkSpeed() {
      return clamp(WALK_SPEED_MEAN + gaussianRandom() * WALK_SPEED_SD, WALK_SPEED_MIN, WALK_SPEED_MAX);
    }
    function samplePremovementTime(conAlarma) {
      const median = conAlarma ? PREMOVEMENT_MEDIAN_ALARM : PREMOVEMENT_MEDIAN_NOALARM;
      const t = median * Math.exp(PREMOVEMENT_SIGMA * gaussianRandom());
      return clamp(t, PREMOVEMENT_MIN_T, PREMOVEMENT_MAX_T);
    }

    let alarmActive = false;
    let autoBreakOnMortal = true;

    const BARRIERS = [
      { x1: 19.9, z1: -6.0,  x2: 20.9, z2: -15.0 },
      { x1: 11.0, z1: -6.5,  x2: 14.0, z2: -6.5  }
    ];

    function segmentsIntersect(x1, z1, x2, z2, x3, z3, x4, z4) {
      const d = (x2 - x1) * (z4 - z3) - (z2 - z1) * (x4 - x3);
      if (Math.abs(d) < 1e-10) return false;
      const t = ((x3 - x1) * (z4 - z3) - (z3 - z1) * (x4 - x3)) / d;
      const u = ((x3 - x1) * (z2 - z1) - (z3 - z1) * (x2 - x1)) / d;
      return t >= 0 && t <= 1 && u >= 0 && u <= 1;
    }

    const windowsList = [];
    const doorsList = [];
    const invisibleWindowBarriers = [];

    function wouldHitBarrier(px, pz, nx, nz, py = 1.2) {
      // --- Barreras invisibles en ventanas ---
      // Bloquean el humo SOLO si la ventana no está rota Y está prácticamente cerrada.
      // Si está abierta (currentOpenRatio > 0.05), el humo pasa por el hueco abierto
      // (la hoja corredera se desplaza hacia el lado negativo, dejando libre
      //  la franja [maxX - openRatio*width, maxX] en eje X, o análoga en Z).
      for (let i = 0; i < invisibleWindowBarriers.length; i++) {
        const b = invisibleWindowBarriers[i];
        if (b.window.isBroken) continue;
        if (py < b.yMin || py > b.yMax) continue;

        const margin = 0.05;
        const openRatio = b.window.currentOpenRatio || 0;

        if (b.axis === 'X') {
          if ((pz - b.centerZ) * (nz - b.centerZ) <= 0) {
            const t = (b.centerZ - pz) / ((nz - pz) || 1e-6);
            if (t >= 0 && t <= 1) {
              const crossX = px + (nx - px) * t;
              if (crossX >= b.minX - margin && crossX <= b.maxX + margin) {
                if (openRatio > 0.05) {
                  const openStart = b.maxX - openRatio * b.width;
                  if (crossX >= openStart) continue; // pasa por el hueco abierto
                }
                return true;
              }
            }
          }
        } else {
          if ((px - b.centerX) * (nx - b.centerX) <= 0) {
            const t = (b.centerX - px) / ((nx - px) || 1e-6);
            if (t >= 0 && t <= 1) {
              const crossZ = pz + (nz - pz) * t;
              if (crossZ >= b.minZ - margin && crossZ <= b.maxZ + margin) {
                if (openRatio > 0.05) {
                  const openStart = b.maxZ - openRatio * b.width;
                  if (crossZ >= openStart) continue; // pasa por el hueco abierto
                }
                return true;
              }
            }
          }
        }
      }

      // --- Puertas ---
      for (let i = 0; i < doorsList.length; i++) {
        const d = doorsList[i];
        if (d.isOpen) continue;
        if (py <= d.height) {
          if (d.isDiagonal) {
            if (segmentsIntersect(px, pz, nx, nz, d.jamb1X, d.jamb1Z, d.jamb2X, d.jamb2Z)) return true;
          } else if (d.axis === 'X') {
            if ((pz - d.centerZ) * (nz - d.centerZ) <= 0) {
              const t = (d.centerZ - pz) / ((nz - pz) || 1e-6);
              if (t >= 0 && t <= 1) {
                const crossX = px + (nx - px) * t;
                if (crossX >= d.minX && crossX <= d.maxX) return true;
              }
            }
          } else {
            if ((px - d.centerX) * (nx - d.centerX) <= 0) {
              const t = (d.centerX - px) / ((nx - px) || 1e-6);
              if (t >= 0 && t <= 1) {
                const crossZ = pz + (nz - pz) * t;
                if (crossZ >= d.minZ && crossZ <= d.maxZ) return true;
              }
            }
          }
        }
      }

      // --- Barreras rígidas adicionales ---
      for (let b = 0; b < BARRIERS.length; b++) {
        const bar = BARRIERS[b];
        if (segmentsIntersect(px, pz, nx, nz, bar.x1, bar.z1, bar.x2, bar.z2)) {
          let escapeThroughWindow = false;
          for (let w of windowsList) {
            if (w.isBroken || (w.currentOpenRatio || 0) > 0.05) {
              if (w.axis === 'Z') {
                if (Math.abs(bar.x1 - w.centerX) < 0.9) {
                  const crossZ = pz + (nz - pz) * 0.5;
                  if (w.isBroken && crossZ >= w.minZ && crossZ <= w.maxZ) { escapeThroughWindow = true; break; }
                  const openBoundary = w.maxZ - (w.currentOpenRatio || 0) * w.width;
                  if (crossZ >= openBoundary && crossZ <= w.maxZ + 0.05) { escapeThroughWindow = true; break; }
                }
              } else {
                if (Math.abs(bar.z1 - w.centerZ) < 0.9) {
                  const crossX = px + (nx - px) * 0.5;
                  if (w.isBroken && crossX >= w.minX && crossX <= w.maxX) { escapeThroughWindow = true; break; }
                  const openBoundary = w.maxX - (w.currentOpenRatio || 0) * w.width;
                  if (crossX >= openBoundary && crossX <= w.maxX + 0.05) { escapeThroughWindow = true; break; }
                }
              }
            }
          }
          if (!escapeThroughWindow) return true;
        }
      }
      return false;
    }

    let collisionGrid = null;
    let gridMinX = 0, gridMinZ = 0;
    let gridStepsX = 0, gridStepsZ = 0;
    const GRID_RES = 0.08;
    const ALTURA_CORTE = 1.2;

      const j = Math.floor((z - gridMinZ) / GRID_RES);
      if (i < 0 || i >= gridStepsX || j < 0 || j >= gridStepsZ) return null;
      const currDist = exitDistField[i + j * gridStepsX];
      if (currDist < 0) return null;
      if (currDist === 0) return { x: 0, z: 0, arrived: true };

      let bestDist = currDist;
      let bestDx = 0, bestDz = 0;
      for (let di = -1; di <= 1; di++) {
        for (let dj = -1; dj <= 1; dj++) {
          if (di === 0 && dj === 0) continue;
          const ni = i + di;
          const nj = j + dj;
          if (ni < 0 || ni >= gridStepsX || nj < 0 || nj >= gridStepsZ) continue;
          const nd = exitDistField[ni + nj * gridStepsX];
          if (nd < 0) continue;
          if (nd < bestDist) {
            bestDist = nd;
            bestDx = di;
            bestDz = dj;
          }
        }
      }
      if (bestDx === 0 && bestDz === 0) return null;
      const len = Math.hypot(bestDx, bestDz);
      return { x: bestDx / len, z: bestDz / len };
    }

    const altoParedes = Math.max(bbox.max.y, 2.8);
    const ceilingGeo = new THREE.PlaneGeometry(floorWidth, floorDepth);
    ceilingGeo.rotateX(Math.PI / 2);
    const ceilingMat = new THREE.MeshStandardMaterial({
      color:0x111111, transparent:true, opacity:0.0, side:THREE.DoubleSide, depthWrite:false
    });
    const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
    ceiling.position.set(floorCenterX, altoParedes, floorCenterZ);
    scene.add(ceiling);

    /* AUDIO */
    let audioCtx = null;

    function playGlassShatterSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const t0 = audioCtx.currentTime;
        const bufferSize = Math.floor(audioCtx.sampleRate * 0.35);
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.08));
        }
        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(2200, t0);
        filter.frequency.exponentialRampToValueAtTime(4500, t0 + 0.3);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.45, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.35);

        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        whiteNoise.start(t0);

        [3400, 4900, 6800, 8900].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const oscGain = audioCtx.createGain();
          osc.type = 'sine';
          const delay = t0 + 0.02 * idx + Math.random() * 0.04;
          osc.frequency.setValueAtTime(freq + (Math.random() - 0.5) * 400, delay);
          oscGain.gain.setValueAtTime(0.09, delay);
          oscGain.gain.exponentialRampToValueAtTime(0.0001, delay + 0.18 + Math.random() * 0.12);
          osc.connect(oscGain);
          oscGain.connect(audioCtx.destination);
          osc.start(delay);
          osc.stop(delay + 0.35);
        });
      } catch (err) {}
    }

    function playWindowSlideSound(isOpen) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const t0 = audioCtx.currentTime;
        const dur = 0.26;
        const bufferSize = Math.floor(audioCtx.sampleRate * dur);
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(isOpen ? 750 : 580, t0);
        filter.frequency.exponentialRampToValueAtTime(isOpen ? 1150 : 420, t0 + dur);
        filter.Q.value = 3.2;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.linearRampToValueAtTime(0.14, t0 + dur * 0.35);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(t0);
      } catch (err) {}
    }

    function playDoorSound(isOpen) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);

    /* VIDRIOS */
    const glassShards = [];

    function detectAndBuildWindows() {
      const sills = [];
      const headers = [];

      model.traverse((child) => {
        if (!child.isMesh || !child.geometry) return;
        const pos = child.geometry.attributes.position;
        const index = child.geometry.index;
        if (!pos || !index) return;

        const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
        const ab = new THREE.Vector3(), ac = new THREE.Vector3(), norm = new THREE.Vector3();

        for (let t = 0; t < index.count; t += 3) {
          const i0 = index.getX(t);
          const i1 = index.getX(t + 1);
          const i2 = index.getX(t + 2);
          a.fromBufferAttribute(pos, i0);
          b.fromBufferAttribute(pos, i1);
          c.fromBufferAttribute(pos, i2);

          if (Math.abs(a.y - b.y) < 0.002 && Math.abs(b.y - c.y) < 0.002) {
            ab.subVectors(b, a);
            ac.subVectors(c, a);
            norm.crossVectors(ab, ac);
            const y = a.y;

            if (norm.y > 0.001 && y > 0.25 && y < 2.50) {
              const xs = [a.x, b.x, c.x];
              const zs = [a.z, b.z, c.z];
              sills.push({ y: y, minX: Math.min(...xs), maxX: Math.max(...xs), minZ: Math.min(...zs), maxZ: Math.max(...zs) });
            } else if (norm.y < -0.001 && y > 1.40 && y < 2.90) {
              const xs = [a.x, b.x, c.x];
              const zs = [a.z, b.z, c.z];
              headers.push({ y: y, minX: Math.min(...xs), maxX: Math.max(...xs), minZ: Math.min(...zs), maxZ: Math.max(...zs) });
            }
          }
        }
      });

      const clusters = [];
      for (const s of sills) {
        let merged = false;
        for (const cl of clusters) {
          if (Math.abs(cl.y - s.y) < 0.02) {
            if (!(s.minX > cl.maxX + 0.15 || s.maxX < cl.minX - 0.15 ||
                  s.minZ > cl.maxZ + 0.15 || s.maxZ < cl.minZ - 0.15)) {
              cl.minX = Math.min(cl.minX, s.minX);
              cl.maxX = Math.max(cl.maxX, s.maxX);
              cl.minZ = Math.min(cl.minZ, s.minZ);
              cl.maxZ = Math.max(cl.maxZ, s.maxZ);
              merged = true;
              break;
            }
          }
        }
        if (!merged) {
          clusters.push({ y: s.y, minX: s.minX, maxX: s.maxX, minZ: s.minZ, maxZ: s.maxZ });
        }
      }

      const glassMaterial = new THREE.MeshStandardMaterial({
        color: 0x9be0ff, roughness: 0.08, metalness: 0.15,
        transparent: true, opacity: 0.42, side: THREE.DoubleSide, depthWrite: false
      });
      const frameMaterial = new THREE.MeshStandardMaterial({ color: 0x222226, roughness: 0.5, metalness: 0.7 });
      const sashFrameMaterial = new THREE.MeshStandardMaterial({ color: 0x2e3238, roughness: 0.45, metalness: 0.75 });
      const crackedMaterial = new THREE.MeshStandardMaterial({
        color: 0x88ccff, roughness: 0.2, metalness: 0.3,
        transparent: true, opacity: 0.55, side: THREE.DoubleSide
      });

      clusters.forEach((cl, index) => {
        const dx = cl.maxX - cl.minX;
        const dz = cl.maxZ - cl.minZ;
        if (Math.max(dx, dz) < 0.5) return;

        let headerY = 2.83;
        let bestArea = 0;
        for (const h of headers) {
          if (h.y > cl.y + 0.35) {
            const ox = Math.max(0, Math.min(cl.maxX, h.maxX) - Math.max(cl.minX, h.minX));
            const oz = Math.max(0, Math.min(cl.maxZ, h.maxZ) - Math.max(cl.minZ, h.minZ));
            if (ox * oz > bestArea) { bestArea = ox * oz; headerY = h.y; }
          }
        }

        const axis = (dx >= dz) ? 'X' : 'Z';
        const width = (axis === 'X') ? dx : dz;
        const wallThick = (axis === 'X') ? dz : dx;
        const height = headerY - cl.y;
        const centerX = (cl.minX + cl.maxX) / 2;
        const centerY = (cl.y + headerY) / 2;
        const centerZ = (cl.minZ + cl.maxZ) / 2;

        let roomBelong = null;
        for (let r = 0; r < ROOMS.length; r++) {
          const rm = ROOMS[r];
          if (centerX >= rm.minX - 0.8 && centerX <= rm.maxX + 0.8 &&
              centerZ >= rm.minZ - 0.8 && centerZ <= rm.maxZ + 0.8) {
            roomBelong = rm;
            break;
          }
        }

        const winGroup = new THREE.Group();
        winGroup.name = 'Ventana_' + (index + 1);
        const borderThick = 0.04;
        const frameDepth = Math.max(0.08, wallThick * 0.5);

        function createBar(w, h, d, px, py, pz) {
          const bar = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), frameMaterial);
          bar.position.set(px, py, pz);
          bar.castShadow = true;
          bar.receiveShadow = true;
          winGroup.add(bar);
        }
        if (axis === 'X') {
          createBar(width, borderThick, frameDepth, centerX, cl.y + borderThick / 2, centerZ);
          createBar(width, borderThick, frameDepth, centerX, headerY - borderThick / 2, centerZ);
          createBar(borderThick, height - borderThick * 2, frameDepth, cl.minX + borderThick / 2, centerY, centerZ);
          createBar(borderThick, height - borderThick * 2, frameDepth, cl.maxX - borderThick / 2, centerY, centerZ);
        } else {
          createBar(frameDepth, borderThick, width, centerX, cl.y + borderThick / 2, centerZ);
          createBar(frameDepth, borderThick, width, centerX, headerY - borderThick / 2, centerZ);
          createBar(frameDepth, height - borderThick * 2, borderThick, centerX, centerY, cl.minZ + borderThick / 2);
          createBar(frameDepth, height - borderThick * 2, borderThick, centerX, centerY, cl.maxZ - borderThick / 2);
        }

        const glassGroup = new THREE.Group();
        glassGroup.name = 'Vidrios_' + (index + 1);
        const sashW = (width / 2) - borderThick * 0.3 + 0.015;
        const sashH = height - borderThick * 2;
        const sashFrameThick = 0.022;
        const glassThick = 0.018;
        const trackSep = 0.016;

        function createSash(isSliding) {
          const sGroup = new THREE.Group();
          const gw = sashW - sashFrameThick * 2;
          const gh = sashH - sashFrameThick * 2;
          const gGeo = (axis === 'X') ?
            new THREE.BoxGeometry(gw, gh, glassThick) :
            new THREE.BoxGeometry(glassThick, gh, gw);
          const gMesh = new THREE.Mesh(gGeo, glassMaterial.clone());
          gMesh.castShadow = false;
          gMesh.receiveShadow = true;
          sGroup.add(gMesh);

          function addSBar(w, h, d, px, py, pz) {
            const bar = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), sashFrameMaterial);
            bar.position.set(px, py, pz);
            bar.castShadow = true;
            bar.receiveShadow = true;
            sGroup.add(bar);
          }
          const fd = Math.max(0.035, wallThick * 0.3);
          if (axis === 'X') {
            addSBar(sashW, sashFrameThick, fd, 0, sashH / 2 - sashFrameThick / 2, 0);
            addSBar(sashW, sashFrameThick, fd, 0, -sashH / 2 + sashFrameThick / 2, 0);
            addSBar(sashFrameThick, sashH, fd, -sashW / 2 + sashFrameThick / 2, 0, 0);
            addSBar(sashFrameThick, sashH, fd, sashW / 2 - sashFrameThick / 2, 0, 0);
            if (isSliding) {
              const handleMesh = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.12, fd + 0.01), frameMaterial);
              handleMesh.position.set(-sashW / 2 + 0.04, 0, 0);
              sGroup.add(handleMesh);
            }
          } else {
            addSBar(fd, sashFrameThick, sashW, 0, sashH / 2 - sashFrameThick / 2, 0);
            addSBar(fd, sashFrameThick, sashW, 0, -sashH / 2 + sashFrameThick / 2, 0);
            addSBar(fd, sashH, sashFrameThick, 0, 0, -sashW / 2 + sashFrameThick / 2);
            addSBar(fd, sashH, sashFrameThick, 0, 0, sashW / 2 - sashFrameThick / 2);
            if (isSliding) {
              const handleMesh = new THREE.Mesh(new THREE.BoxGeometry(fd + 0.01, 0.12, 0.018), frameMaterial);
              handleMesh.position.set(0, 0, -sashW / 2 + 0.04);
              sGroup.add(handleMesh);
            }
          }
          return sGroup;
        }

        const fixedPaneGroup = createSash(false);
        if (axis === 'X') {
          fixedPaneGroup.position.set(centerX - width / 4, centerY, centerZ - trackSep);
        } else {
          fixedPaneGroup.position.set(centerX - trackSep, centerY, centerZ - width / 4);
        }
        glassGroup.add(fixedPaneGroup);

        const slidingPaneGroup = createSash(true);
        let baseSlidingPos = 0;
        if (axis === 'X') {
          baseSlidingPos = centerX + width / 4;
          slidingPaneGroup.position.set(baseSlidingPos, centerY, centerZ + trackSep);
        } else {
          baseSlidingPos = centerZ + width / 4;
          slidingPaneGroup.position.set(centerX + trackSep, centerY, baseSlidingPos);
        }
        glassGroup.add(slidingPaneGroup);
        winGroup.add(glassGroup);

        const jaggedGroup = new THREE.Group();
        const glassW = width - borderThick * 1.5;
        const shardBorderGeo = (axis === 'X') ?
          new THREE.BoxGeometry(glassW, 0.08, glassThick * 1.2) :
          new THREE.BoxGeometry(glassThick * 1.2, 0.08, glassW);
        const shardBottom = new THREE.Mesh(shardBorderGeo, crackedMaterial);
        shardBottom.position.set(centerX, cl.y + borderThick + 0.04, centerZ);
        jaggedGroup.add(shardBottom);
        jaggedGroup.visible = false;
        winGroup.add(jaggedGroup);

        scene.add(winGroup);

        const windowData = {
          id: index + 1,
          axis: axis,
          group: winGroup,
          glassGroup: glassGroup,
          fixedPaneGroup: fixedPaneGroup,
          slidingPaneGroup: slidingPaneGroup,
          jaggedGroup: jaggedGroup,
          room: roomBelong,
          centerX: centerX, centerY: centerY, centerZ: centerZ,
          width: width, height: height,
          sillY: cl.y, headerY: headerY,
          minX: cl.minX, maxX: cl.maxX, minZ: cl.minZ, maxZ: cl.maxZ,
          baseSlidingPos: baseSlidingPos,
          targetOpenRatio: 0.0,
          currentOpenRatio: 0.0,
          isBroken: false
        };

        fixedPaneGroup.traverse(child => { if (child.isMesh) child.userData = { windowData: windowData }; });
        slidingPaneGroup.traverse(child => { if (child.isMesh) child.userData = { windowData: windowData }; });

        windowsList.push(windowData);
      });
    }

    function shatterWindow(win, cause = 'mortal') {
      if (!win || win.isBroken) return;
      win.isBroken = true;
      win.glassGroup.visible = false;
      win.jaggedGroup.visible = true;

      playGlassShatterSound();

      const shardCount = IS_MOBILE ? 24 : 45;
      const shardMaterial = new THREE.MeshStandardMaterial({
        color: 0x9be0ff, roughness: 0.1, metalness: 0.2,
        transparent: true, opacity: 0.7, side: THREE.DoubleSide
      });

      let nx = 0, nz = 0;
      if (win.axis === 'X') {
        nz = (win.centerZ < -10) ? -1 : 1;
      } else {
        nx = (win.centerX > 12) ? 1 : -1;
      }

      for (let i = 0; i < shardCount; i++) {
        const sz = 0.05 + Math.random() * 0.14;
        const geom = new THREE.BufferGeometry();
        const p1 = [0, 0, 0];
        const p2 = [(Math.random() - 0.5) * sz, sz, (Math.random() - 0.5) * sz];
        const p3 = [sz, (Math.random() - 0.5) * sz, (Math.random() - 0.5) * sz];
        geom.setAttribute('position', new THREE.Float32BufferAttribute([...p1, ...p2, ...p3], 3));
        geom.computeVertexNormals();

        const shard = new THREE.Mesh(geom, shardMaterial);

        let posX = win.centerX;
        let posZ = win.centerZ;
        if (win.axis === 'X') {
          posX += (Math.random() - 0.5) * (win.width * 0.85);
        } else {
          posZ += (Math.random() - 0.5) * (win.width * 0.85);
        }
        const posY = win.sillY + 0.1 + Math.random() * (win.height - 0.2);
        shard.position.set(posX, posY, posZ);

        const burstSpeed = 1.2 + Math.random() * 2.8;
        const vel = new THREE.Vector3(
          nx * burstSpeed + (Math.random() - 0.5) * 1.5,
          0.8 + Math.random() * 1.8,
          nz * burstSpeed + (Math.random() - 0.5) * 1.5
        );
        const rot = new THREE.Vector3(
          (Math.random() - 0.5) * 15,
          (Math.random() - 0.5) * 15,
          (Math.random() - 0.5) * 15
        );

        scene.add(shard);
        glassShards.push({
          mesh: shard, velocity: vel, rotSpeed: rot,
          life: 4.5 + Math.random() * 2.0, maxLife: 6.0
        });
      }
    }

    function repairAllWindows() {
      windowsList.forEach(w => {
        w.isBroken = false;
        w.targetOpenRatio = 0.0;
        w.currentOpenRatio = 0.0;
        w.glassGroup.visible = true;
        w.jaggedGroup.visible = false;
        if (w.slidingPaneGroup) {
          if (w.axis === 'X') {
            w.slidingPaneGroup.position.x = w.baseSlidingPos;
          } else {
            w.slidingPaneGroup.position.z = w.baseSlidingPos;
          }
        }
      });
      invisibleWindowBarriers.forEach(b => { b.window.isBroken = false; });
      glassShards.forEach(s => scene.remove(s.mesh));
      glassShards.length = 0;
    }

    function updateWindows(delta) {
      for (let i = 0; i < windowsList.length; i++) {
        const w = windowsList[i];
        if (w.isBroken) continue;
        if (Math.abs(w.currentOpenRatio - w.targetOpenRatio) > 0.002) {
          w.currentOpenRatio = THREE.MathUtils.lerp(w.currentOpenRatio, w.targetOpenRatio, 0.14);
        } else {
          w.currentOpenRatio = w.targetOpenRatio;
        }
        const slideOffset = w.currentOpenRatio * w.width;
        if (w.axis === 'X') {
          w.slidingPaneGroup.position.x = w.baseSlidingPos - slideOffset;
        } else {
          w.slidingPaneGroup.position.z = w.baseSlidingPos - slideOffset;
        }
      }
    }

    function updateGlassShards(delta) {
      if (glassShards.length === 0) return;
      const step = Math.min(delta, 0.05);

      for (let i = glassShards.length - 1; i >= 0; i--) {
        const s = glassShards[i];
        s.life -= step;
        if (s.life <= 0) {
          scene.remove(s.mesh);
          s.mesh.geometry.dispose();
          glassShards.splice(i, 1);
          continue;
        }
        s.velocity.y -= 9.8 * step;
        s.mesh.position.addScaledVector(s.velocity, step);
        s.mesh.rotation.x += s.rotSpeed.x * step;
        s.mesh.rotation.y += s.rotSpeed.y * step;
        s.mesh.rotation.z += s.rotSpeed.z * step;

        if (s.mesh.position.y <= 0.015) {
          s.mesh.position.y = 0.015;
          if (s.velocity.y < -0.3) {
            s.velocity.y = -s.velocity.y * 0.25;
          } else {
            s.velocity.y = 0;
          }
          s.velocity.x *= 0.65;
          s.velocity.z *= 0.65;
          s.rotSpeed.multiplyScalar(0.7);
        }
        if (s.life < 1.5) {
          s.mesh.material.opacity = (s.life / 1.5) * 0.7;
        }
      }
    }

    detectAndBuildWindows();

    /* === BARRERAS INVISIBLES DE HUMO EN VENTANAS ===
       - Cubren todo el hueco vertical (alféizar → techo) para que el humo no se
         escape por encima del dintel cuando la ventana está cerrada.
       - Si la ventana está ABIERTA (currentOpenRatio > 0.05) o ROTA, el humo
         atraviesa la franja abierta (lado positivo del eje) y sale. */
    function buildInvisibleWindowBarriers() {
      invisibleWindowBarriers.length = 0;
      const yTop = TECHO_HUMO + 0.35;

      for (const w of windowsList) {
        invisibleWindowBarriers.push({
          window: w,
          axis: w.axis,
          centerX: w.centerX,
          centerZ: w.centerZ,
          width: w.width,
          minX: w.minX,
          maxX: w.maxX,
          minZ: w.minZ,
          maxZ: w.maxZ,
          yMin: w.sillY,
          yMax: yTop
        });
      }
      console.log(`[Incendio] Barreras invisibles creadas: ${invisibleWindowBarriers.length}`);
      invisibleWindowBarriers.forEach((b, i) => {
        const nombreSala = b.window.room ? b.window.room.name : 'sin sala';

    function createDoor(cfg) {
      const doorThick = 0.045;

        color: 0x7c4f2e, roughness: 0.55, metalness: 0.12, side: THREE.DoubleSide

      const handleMat = new THREE.MeshStandardMaterial({ color: 0xd6dadf, roughness: 0.25, metalness: 0.9 });

      const frameGroup = new THREE.Group();
      const frameTrim = 0.04;
      const frameDepth = Math.max(0.10, cfg.wallThick * 0.6);

      function addFrameBar(w, h, d, px, py, pz) {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), frameMat);
        bar.position.set(px, py, pz);
        bar.castShadow = true;
        bar.receiveShadow = true;
        frameGroup.add(bar);
      }

      if (cfg.isDiagonal) {
        const dFrame = new THREE.Group();
        const dBarTop = new THREE.Mesh(new THREE.BoxGeometry(cfg.width, frameTrim, frameDepth), frameMat);
        dBarTop.position.set(0, cfg.height - frameTrim / 2, 0);
        dFrame.add(dBarTop);
        const dPostL = new THREE.Mesh(new THREE.BoxGeometry(frameTrim, cfg.height, frameDepth), frameMat);
        dPostL.position.set(-cfg.width / 2 + frameTrim / 2, cfg.height / 2, 0);
        dFrame.add(dPostL);
        const dPostR = new THREE.Mesh(new THREE.BoxGeometry(frameTrim, cfg.height, frameDepth), frameMat);
        dPostR.position.set(cfg.width / 2 - frameTrim / 2, cfg.height / 2, 0);
        dFrame.add(dPostR);
        dFrame.position.set(cfg.centerX, 0, cfg.centerZ);
        dFrame.rotation.y = cfg.baseAngle;
        frameGroup.add(dFrame);
      } else if (cfg.axis === 'Z') {
        addFrameBar(frameDepth, frameTrim, cfg.width, cfg.centerX, cfg.height - frameTrim / 2, cfg.centerZ);
        addFrameBar(frameDepth, cfg.height, frameTrim, cfg.centerX, cfg.height / 2, cfg.minZ + frameTrim / 2);
        addFrameBar(frameDepth, cfg.height, frameTrim, cfg.centerX, cfg.height / 2, cfg.maxZ - frameTrim / 2);
      } else {
        addFrameBar(cfg.width, frameTrim, frameDepth, cfg.centerX, cfg.height - frameTrim / 2, cfg.centerZ);
        addFrameBar(frameTrim, cfg.height, frameDepth, cfg.minX + frameTrim / 2, cfg.height / 2, cfg.centerZ);
        addFrameBar(frameTrim, cfg.height, frameDepth, cfg.maxX - frameTrim / 2, cfg.height / 2, cfg.centerZ);
      }
      scene.add(frameGroup);

      const pivotGroup = new THREE.Group();
      pivotGroup.position.set(cfg.hingeX, 0, cfg.hingeZ);
      const initialAngle = cfg.isDiagonal ? cfg.baseAngle : 0;
      pivotGroup.rotation.y = initialAngle;

      let doorGeo;
      if (cfg.axis === 'Z' && !cfg.isDiagonal) {
        doorGeo = new THREE.BoxGeometry(doorThick, doorHeight, doorWidth);
      } else {
        doorGeo = new THREE.BoxGeometry(doorWidth, doorHeight, doorThick);
      }

      const doorMesh = new THREE.Mesh(doorGeo, doorMat);
      doorMesh.castShadow = true;
      doorMesh.receiveShadow = true;
      if (cfg.axis === 'Z' && !cfg.isDiagonal) {
        doorMesh.position.set(0, doorHeight / 2, doorWidth / 2);
      } else {
        doorMesh.position.set(doorWidth / 2, doorHeight / 2, 0);
      }
      pivotGroup.add(doorMesh);

      const trimGeo = (cfg.axis === 'Z' && !cfg.isDiagonal) ?
        new THREE.BoxGeometry(doorThick + 0.006, doorHeight * 0.85, doorWidth * 0.75) :
        new THREE.BoxGeometry(doorWidth * 0.75, doorHeight * 0.85, doorThick + 0.006);
      const trimMesh = new THREE.Mesh(trimGeo, new THREE.MeshStandardMaterial({
        color: 0x683f21, roughness: 0.6, metalness: 0.1
      }));
      trimMesh.position.copy(doorMesh.position);
      pivotGroup.add(trimMesh);

      const handleY = 1.0;
      const handleLen = 0.11;
      const isZOnly = (cfg.axis === 'Z' && !cfg.isDiagonal);
      const hLocalPos = isZOnly ?
        new THREE.Vector3(0, handleY, doorWidth - 0.08) :
        new THREE.Vector3(doorWidth - 0.08, handleY, 0);

      function createHandle(side) {
        const hGroup = new THREE.Group();
        const roseGeo = isZOnly ?
          new THREE.BoxGeometry(0.01, 0.14, 0.04) :
          new THREE.BoxGeometry(0.04, 0.14, 0.01);
        const rose = new THREE.Mesh(roseGeo, handleMat);
        hGroup.add(rose);
        const pinGeo = new THREE.CylinderGeometry(0.008, 0.008, 0.04, 8);
        const pin = new THREE.Mesh(pinGeo, handleMat);
        pin.rotation.z = isZOnly ? Math.PI / 2 : 0;
        pin.rotation.x = isZOnly ? 0 : Math.PI / 2;
        pin.position.set((isZOnly ? side * 0.02 : 0), 0, (isZOnly ? 0 : side * 0.02));
        hGroup.add(pin);
        const leverGeo = isZOnly ?
          new THREE.BoxGeometry(0.014, 0.014, handleLen) :
          new THREE.BoxGeometry(handleLen, 0.014, 0.014);
        const lever = new THREE.Mesh(leverGeo, handleMat);
        lever.position.set(
          (isZOnly ? side * (doorThick / 2 + 0.025) : -handleLen / 3),
          0,
          (isZOnly ? -handleLen / 3 : side * (doorThick / 2 + 0.025))

        hGroup.add(lever);
        hGroup.position.set(
          hLocalPos.x + (isZOnly ? side * (doorThick / 2 + 0.005) : 0),
          hLocalPos.y,
          hLocalPos.z + (isZOnly ? 0 : side * (doorThick / 2 + 0.005))

        return hGroup;

      if (e.target.closest('#ui') || e.target.closest('#btn-menu') || e.target.closest('#tabla-seguridad')) return;
      const dist = Math.hypot(e.clientX - ptrDown.x, e.clientY - ptrDown.y);
      if (dist > 8 || (Date.now() - ptrDown.time) > 400) return;

      clickPointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      clickPointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

      if (firePlacementMode) {

        if (floorHits.length > 0) {
          const pt = floorHits[0].point;
          if (!addFireAt(pt.x, pt.z)) flashFireLimit();
        }
        return;

      const doorClickMeshes = [];
      doorsList.forEach(d => {
        d.pivotGroup.traverse(child => {
          if (child.isMesh) doorClickMeshes.push(child);
        });
      });
      const doorHits = clickRaycaster.intersectObjects(doorClickMeshes);
      if (doorHits.length > 0) {
        let hitObj = doorHits[0].object;
        let dData = null;
        while (hitObj && !dData) {
          if (hitObj.userData && hitObj.userData.doorData) dData = hitObj.userData.doorData;
          hitObj = hitObj.parent;
        }
        if (!dData) {
          const hitPt = doorHits[0].point;
          for (let d of doorsList) {
            if (Math.hypot(hitPt.x - d.centerX, hitPt.z - d.centerZ) < 1.2) { dData = d; break; }
          }

        if (dData) { dData.toggle(); return; }
      }

      windowsList.filter(w => !w.isBroken).forEach(w => {
        w.glassGroup.traverse(child => {
          if (child.isMesh) windowMeshes.push(child);
        });
      });
      const windowHits = clickRaycaster.intersectObjects(windowMeshes);
      if (windowHits.length > 0) {
        let hitObj = windowHits[0].object;
        let wData = null;
        while (hitObj && !wData) {
          if (hitObj.userData && hitObj.userData.windowData) wData = hitObj.userData.windowData;
          hitObj = hitObj.parent;

    function isWalkable(x, z) {
      if (!insideGrid || !isInsideRoomGeometry(x, z)) return false;
      const i = Math.floor((x - gridMinX) / GRID_RES);
      const j = Math.floor((z - gridMinZ) / GRID_RES);
      if (i < 0 || i >= gridStepsX || j < 0 || j >= gridStepsZ) return false;
      return insideGrid[i + j * gridStepsX] === 1;
