      const cx = Math.floor((x - heatMinX) / heatCellW);
      const cz = Math.floor((z - heatMinZ) / heatCellD);
      if (cx < 0 || cx >= HEAT_COLS || cz < 0 || cz >= HEAT_ROWS) return 0;
      return heatSmooth[cx + cz * HEAT_COLS];
    }

    function getSpeedFactorByHeat(x, z) {
      const density = getHeatAt(x, z);
      const t = Math.min(density / DENSITY_MAX, 1);
      for (let i = 0; i < VIS_BREAKS.length; i++) {
        if (t < VIS_BREAKS[i]) return VIS_FACTORS[i];
      }
      return VIS_FACTORS[VIS_FACTORS.length - 1];
    }

    function getFedRate(x, z) {
      const density = getHeatAt(x, z);
      if (density <= SMOKE_SAFE_DENSITY) return 0;
      const d = Math.min(density, DENSITY_MAX);
      return ((d - SMOKE_SAFE_DENSITY) / (DENSITY_MAX - SMOKE_SAFE_DENSITY)) / SMOKE_FED_TIME;
    }

    function snapToNearestWalkable(x, z) {
      for (let r = 1; r <= 10; r++) {
        for (let dx = -r; dx <= r; dx++) {
          for (let dz = -r; dz <= r; dz++) {
            if (Math.abs(dx) !== r && Math.abs(dz) !== r) continue;
            const nx = x + dx * GRID_RES;
            const nz = z + dz * GRID_RES;
            if (isWalkable(nx, nz)) return { x: nx, z: nz };
          }
        }
      }
      return null;
    }

    let _deathMarkerTexture = null;
    function getDeathMarkerTexture() {
      if (_deathMarkerTexture) return _deathMarkerTexture;
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 128, 128);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 28; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(30, 30); ctx.lineTo(98, 98); ctx.moveTo(98, 30); ctx.lineTo(30, 98); ctx.stroke();
      ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 18; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(30, 30); ctx.lineTo(98, 98); ctx.moveTo(98, 30); ctx.lineTo(30, 98); ctx.stroke();
      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 8; tex.needsUpdate = true;
      _deathMarkerTexture = tex;
      return tex;
    }

    function createDeathMarker() {
      const mat = new THREE.SpriteMaterial({ map: getDeathMarkerTexture(), transparent: true, depthTest: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(0.55, 0.55, 1);
      sprite.position.set(0, 1.75, 0);
      return sprite;
    }

    let _alertMarkerTexture = null;
    function getAlertMarkerTexture() {
      if (_alertMarkerTexture) return _alertMarkerTexture;
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath(); ctx.arc(64, 64, 52, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff2200';
      ctx.beginPath(); ctx.arc(64, 64, 44, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 68px Arial, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('!', 64, 62);
      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 8; tex.needsUpdate = true;
      _alertMarkerTexture = tex;
      return tex;
    }

    function createAlertMarker() {
      const mat = new THREE.SpriteMaterial({ map: getAlertMarkerTexture(), transparent: true, depthTest: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(0.65, 0.65, 1);
      sprite.position.set(0, 1.7, 0);
      sprite.visible = false;
      return sprite;
    }

    function createPerson(x, z, color = 0x2266ff, workstation = null) {
      const group = new THREE.Group();
      const bodyGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.9, 12);
      const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.45;
      body.castShadow = true;

      const headGeo = new THREE.SphereGeometry(0.14, 12, 12);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.8 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 0.9 + 0.14;
      head.castShadow = true;
      group.add(body, head);

      const alertMarker = createAlertMarker();
      group.add(alertMarker);

      let px = x, pz = z;
      let rotY = Math.random() * Math.PI * 2;
      let isSitting = false;
      if (workstation) {
        px = workstation.seatPos.x;
        pz = workstation.seatPos.z;
        rotY = workstation.rotationY + Math.PI;
        isSitting = true;
        workstation.occupied = true;
      }

      group.position.set(px, isSitting ? 0.25 : 0, pz);
      group.rotation.y = rotY;
      scene.add(group);

      const personObj = {
        mesh: group, body: body, head: head,
        x: px, z: pz,
        workstation: workstation,
        speed: sampleWalkSpeed(),
        animOffset: Math.random() * Math.PI * 2,
        idleTime: 0, stuckFrames: 0,
        state: isSitting ? 'sitting' : 'wandering',
        alerted: false, reactionDelay: 0,
        contagionCue: false,
        wanderAngle: rotY,
        wanderTimer: 1.0 + Math.random() * 2.0,
        fed: 0,
        isDead: false,
        deathMarker: null,
        alertMarker: alertMarker,
        originRoomIdx: -1,
        lost: false,
        confusionTimer: 0,
        confusionTarget: null,
        confusionCooldown: 0,
        bumpTimer: 0
      };
      people.push(personObj);
      return personObj;
    }

    function getRandomWalkablePointInRoom(roomObj) {
      if (!walkableList || walkableList.length === 0) return { x: 15, z: -10 };
      const candidates = walkableList.filter(pt =>
        pt.x >= roomObj.minX && pt.x <= roomObj.maxX &&
        pt.z >= roomObj.minZ && pt.z <= roomObj.maxZ &&
        !isNearExit(pt.x, pt.z)
      );
      if (candidates.length > 0) return candidates[Math.floor(Math.random() * candidates.length)];
      return { x: (roomObj.minX + roomObj.maxX) / 2, z: (roomObj.minZ + roomObj.maxZ) / 2 };
    }

    function clearPeople() {
      people.forEach(p => scene.remove(p.mesh));
      people.length = 0;
    }

    const SPAWN_ROOMS = [
      { key: 'rojo',    roomIdx: 0, slider: 'rng-cant-rojo',    defaultCount: 8 },
      { key: 'verde',   roomIdx: 2, slider: 'rng-cant-verde',   defaultCount: 4 },
      { key: 'naranja', roomIdx: 3, slider: 'rng-cant-naranja', defaultCount: 4 },
      { key: 'azul',    roomIdx: 4, slider: 'rng-cant-azul',    defaultCount: 4 }
    ];

    function readSliderCount(def) {
      const el = document.getElementById(def.slider);
      return el ? parseInt(el.value) : def.defaultCount;
    }

    function populateRoom(def, targetCount, colorOffset) {
      const current = people.filter(p => p.roomKey === def.key);
      if (current.length === targetCount) return;

      if (current.length > targetCount) {
        const toRemove = current.slice(targetCount);
        toRemove.forEach(p => {
          scene.remove(p.mesh);
          const idx = people.indexOf(p);
          if (idx >= 0) people.splice(idx, 1);
          if (p.workstation) p.workstation.occupied = false;
        });
        return;
      }

      const wss = workstations.filter(ws => ws.roomId === def.key);
      const free = wss.filter(ws => !ws.occupied);
      for (let i = free.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [free[i], free[j]] = [free[j], free[i]];
      }
      const need = targetCount - current.length;
      for (let i = 0; i < need; i++) {
        const color = ROOM_COLORS[def.key] ?? PERSON_COLORS[(current.length + i + colorOffset) % PERSON_COLORS.length];
        let p;
        if (i < free.length) {
          p = createPerson(free[i].seatPos.x, free[i].seatPos.z, color, free[i]);
        } else {
          const pt = getRandomWalkablePointInRoom(ROOMS[def.roomIdx]);
          p = createPerson(pt.x, pt.z, color, null);
        }
        p.roomKey = def.key;
        p.originRoomIdx = def.roomIdx;
      }
    }

    function refreshDeathCount() {
      deathCount = people.filter(p => p.isDead).length;
      updateDeathCounter();
    }

    function spawnRoom(key, count) {
      const def = SPAWN_ROOMS.find(d => d.key === key);
      if (!def) return;
      if (count === null || count === undefined) count = readSliderCount(def);
      let offset = 0;
      for (const d of SPAWN_ROOMS) {
        if (d.key === key) break;
        offset += readSliderCount(d);
      }
      populateRoom(def, count, offset);
      refreshDeathCount();
    }

    function spawnPeople(countRojo = null, countVerde = null, countNaranja = null, countAzul = null) {
      const counts = { 'rojo': countRojo, 'verde': countVerde, 'naranja': countNaranja, 'azul': countAzul };
      clearPeople();
      workstations.forEach(ws => ws.occupied = false);
      let offset = 0;
      for (const def of SPAWN_ROOMS) {
        let c = counts[def.key];
        if (c === null || c === undefined) c = readSliderCount(def);
        populateRoom(def, c, offset);
        offset += c;
      }
      deathCount = 0;
      updateDeathCounter();
    }

    spawnPeople();
    updateDeathCounter();

    function removePerson(index) {
      scene.remove(people[index].mesh);
      people.splice(index, 1);
    }

    function killPerson(p) {
      if (p.isDead) return;
      p.isDead = true;
      p.state = 'dead';
      p.fed = 1;

      p.body.material.color.setHex(0x000000);
      p.head.material.color.setHex(0x000000);
      p.body.material.roughness = 1.0;
      p.head.material.roughness = 1.0;
      p.body.position.y = 0.45;
      p.head.position.y = 1.04;

      if (!p.deathMarker) {
        const marker = createDeathMarker();
        p.mesh.add(marker);
        p.deathMarker = marker;
      }

      deathCount++;
      updateDeathCounter();
    }

    function collidesWithOthers(self, x, z, radius) {
      const r2 = radius * radius;
      for (let k = 0; k < people.length; k++) {
        const o = people[k];
        if (o === self || o.isDead) continue;
        if (o.state === 'sitting') continue;
        const dx = o.x - x;
        const dz = o.z - z;
        if (dx * dx + dz * dz < r2) return true;
      }
      return false;
    }

    const STEER_OFFSETS = [0, 0.35, -0.35, 0.70, -0.70, 1.05, -1.05, 1.40, -1.40, 1.75, -1.75];
    function findClearStep(p, baseAngle, step) {
      for (let s = 0; s < STEER_OFFSETS.length; s++) {
        const a = baseAngle + STEER_OFFSETS[s];
        const nx = p.x + Math.sin(a) * step;
        const nz = p.z + Math.cos(a) * step;
        if (isWalkable(nx, nz) && !collidesWithOthers(p, nx, nz, PERSON_COLLISION_R)) {
          return { x: nx, z: nz, angle: a };
        }
      }
      return null;
    }

    const MAX_SUBSTEP = PERSON_COLLISION_R * 0.75;
    function advancePerson(p, baseAngle, step) {
      let remaining = step;
      let angle = baseAngle;
      let moved = false;
      while (remaining > 1e-4) {
        const sub = Math.min(remaining, MAX_SUBSTEP);
        const next = findClearStep(p, angle, sub);
        if (!next) break;
        p.x = next.x; p.z = next.z;
        p.mesh.position.set(p.x, 0, p.z);
        angle = next.angle;
        moved = true;
        remaining -= sub;
      }
      return moved ? angle : null;
    }

    function startConfusion(p) {
      const options = LAB_ROOM_IDX_S.filter(idx => idx !== p.originRoomIdx);
      if (options.length === 0) return;
      p.wrongRoomIdx = options[Math.floor(Math.random() * options.length)];
      p.confusionTarget = getRandomWalkablePointInRoom(ROOMS[p.wrongRoomIdx]);
      p.lost = true;
      p.confusionTimer = CONFUSION_TIME_MIN + Math.random() * (CONFUSION_TIME_MAX - CONFUSION_TIME_MIN);
      if (p.alertMarker) p.alertMarker.visible = false;
    }

    function maybeConfuse(p, delta) {
      if (p.lost) return;
      if (isNearExit(p.x, p.z)) return;
      let bestD2 = Infinity;
      for (let k = 0; k < EXITS.length; k++) {
        const dx = p.x - EXITS[k].x;
        const dz = p.z - EXITS[k].z;
        const d2 = dx * dx + dz * dz;
        if (d2 < bestD2) bestD2 = d2;
      }
      if (bestD2 < CONFUSION_SAFE_R * CONFUSION_SAFE_R) return;
      if (Math.random() < CONFUSION_CHANCE * delta * simSpeed) startConfusion(p);
    }

    function updatePeople(delta, time) {
      if (!isPeopleVisible) return;

      if (evacuationMode) {
        for (let i = 0; i < people.length; i++) {
          const a = people[i];
          if (a.isDead || a.state !== 'evacuating') continue;
          for (let j = 0; j < people.length; j++) {
            if (i === j) continue;
            const b = people[j];
            if (b.isDead || b.state === 'evacuating') continue;
            const dx = a.x - b.x;
            const dz = a.z - b.z;
            if (dx * dx + dz * dz <= CONTAGION_RADIUS * CONTAGION_RADIUS) {
              if (!b.contagionCue) {
                b.contagionCue = true;
                const cue = CONTAGION_DELAY_MIN + Math.random() * (CONTAGION_DELAY_MAX - CONTAGION_DELAY_MIN);
                if (b.reactionDelay <= 0) b.reactionDelay = cue;
                else b.reactionDelay = Math.min(b.reactionDelay, cue);
              }
            }
          }
        }
      }

      for (let i = people.length - 1; i >= 0; i--) {
        const p = people[i];
        p.mesh.visible = isPeopleVisible;

        if (p.isDead) {
          if (p.deathMarker) {
            p.deathMarker.position.y = 1.75 + Math.sin(time * 2.0 + p.animOffset) * 0.06;
          }
          continue;
        }
        if (!isPeopleMoving) continue;

        const estadoRecinto = getRoomStatusAt(p.x, p.z);
        p.fed += getFedRate(p.x, p.z) * delta * simSpeed;
        if (p.fed >= 1) { killPerson(p); continue; }

        const dangerFactor = getSpeedFactorByHeat(p.x, p.z);

        if ((p.state === 'sitting' || p.state === 'wandering') && evacuationMode) {
          const heat = getHeatAt(p.x, p.z);
          const recintoPeligroso = (estadoRecinto === 'Peligroso' ||
                                    estadoRecinto === 'Muy Peligroso' ||
                                    estadoRecinto === 'Mortal');
          const detecta = alarmActive || p.contagionCue ||
                          heat >= HUMO_THRESHOLD || recintoPeligroso;
          if (detecta) {
            if (p.reactionDelay <= 0) {
              p.reactionDelay = samplePremovementTime(alarmActive);
            }
            p.reactionDelay -= delta * simSpeed;
            if (p.reactionDelay <= 0) {
              p.state = 'evacuating';
              if (p.alertMarker) p.alertMarker.visible = false;
            }
          }
        }

        if (p.state === 'sitting') {
          const typingAnim = Math.sin(time * 4.0 + p.animOffset);
          p.body.position.y = 0.45 + typingAnim * 0.01;
          p.head.position.y = 1.04 + typingAnim * 0.015;
          p.mesh.position.set(p.x, 0.25, p.z);
          continue;
        }

        if (p.state === 'wandering') {
          if (p.idleTime > 0) {
            p.idleTime -= delta * simSpeed;
            p.body.position.y = 0.45;
            p.head.position.y = 1.04;
            continue;
          }

          p.wanderTimer -= delta * simSpeed;
          if (p.wanderTimer <= 0) {
            p.wanderAngle = Math.random() * Math.PI * 2;
            p.wanderTimer = 1.5 + Math.random() * 2.5;
          }

          let diff = p.wanderAngle - p.mesh.rotation.y;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          p.mesh.rotation.y += diff * 0.10;

          const moveAngle = p.mesh.rotation.y;
          const step = Math.min(p.speed * WANDER_SPEED_FACTOR * dangerFactor * delta * simSpeed, MAX_SUBSTEP);
          const nextX = p.x + Math.sin(moveAngle) * step;
          const nextZ = p.z + Math.cos(moveAngle) * step;

          if (isWalkable(nextX, nextZ) && !isNearExit(nextX, nextZ)) {
            p.x = nextX; p.z = nextZ;
            p.mesh.position.set(p.x, 0, p.z);
            p.stuckFrames = 0;
            const walkCycle = Math.sin(time * 8 * p.speed + p.animOffset);
            p.body.position.y = 0.45 + Math.abs(walkCycle) * 0.05;
            p.head.position.y = 1.04 + Math.abs(walkCycle) * 0.05;
          } else {
            let found = false;
            for (let intento = 0; intento < 10; intento++) {
              const ang = Math.random() * Math.PI * 2;
              const tx = p.x + Math.sin(ang) * step;
              const tz = p.z + Math.cos(ang) * step;
              if (isWalkable(tx, tz) && !isNearExit(tx, tz)) {
                p.wanderAngle = ang;
                p.wanderTimer = 1.5 + Math.random() * 2.5;
                found = true;
                break;
              }
            }
            if (!found) p.idleTime = 0.3 + Math.random() * 0.5;
            p.stuckFrames++;
            if (p.stuckFrames > 60) {
              const snap = snapToNearestWalkable(p.x, p.z);
              if (snap) { p.x = snap.x; p.z = snap.z; p.mesh.position.set(p.x, 0, p.z); }
              p.stuckFrames = 0;
            }
          }
          continue;
        }

        if (p.state === 'evacuating') {
          if (p.idleTime > 0) {
            p.idleTime -= delta * simSpeed;
            p.body.position.y = 0.45;
            p.head.position.y = 1.04;
            continue;
          }

          if (!p.lost && isNearExit(p.x, p.z)) {
            removePerson(i);
            continue;
          }

          if (p.lost) {
            p.confusionTimer -= delta * simSpeed;
            if (p.confusionTimer <= 0) {
              p.lost = false;
              p.confusionTarget = null;
              p.confusionCooldown = CONFUSION_COOLDOWN;
            }
          } else if (p.confusionCooldown > 0) {
            p.confusionCooldown -= delta * simSpeed;
          } else {
            maybeConfuse(p, delta);
          }

          let dir;
          if (p.lost && p.confusionTarget) {
            const tdx = p.confusionTarget.x - p.x;
            const tdz = p.confusionTarget.z - p.z;
            const tdist = Math.hypot(tdx, tdz);
            if (tdist < 0.45) {
              p.idleTime = 0.5 + Math.random() * 0.8;
              p.lost = false;
              p.confusionTarget = null;
              p.confusionCooldown = CONFUSION_COOLDOWN;
              continue;
            }
            dir = { x: tdx / tdist, z: tdz / tdist };
          } else {
            dir = getFlowDirection(p.x, p.z);
            if (!dir) {
              p.idleTime = 0.3 + Math.random() * 0.4;
              if (!isWalkable(p.x, p.z)) {
                const snap = snapToNearestWalkable(p.x, p.z);
                if (snap) { p.x = snap.x; p.z = snap.z; p.mesh.position.set(p.x, 0, p.z); }
              }
              continue;
            }
            if (dir.arrived) { removePerson(i); continue; }
          }

          const targetAngle = Math.atan2(dir.x, dir.z);
          let diff = targetAngle - p.mesh.rotation.y;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          p.mesh.rotation.y += diff * 0.15;

          const step = p.speed * dangerFactor * delta * simSpeed;
          const moveAngle = p.mesh.rotation.y;
          const endAngle = advancePerson(p, moveAngle, step);

          if (endAngle !== null) {
            p.mesh.rotation.y = endAngle;
            p.stuckFrames = 0;
            p.bumpTimer = 0;

            for (let di = 0; di < doorsList.length; di++) {
              const d = doorsList[di];
              if (!d.isOpen && Math.hypot(p.x - d.centerX, p.z - d.centerZ) < 1.1) {
                d.open();
              }
            }

            const walkCycle = Math.sin(time * 10 * p.speed + p.animOffset);
            p.body.position.y = 0.45 + Math.abs(walkCycle) * 0.05;
            p.head.position.y = 1.04 + Math.abs(walkCycle) * 0.05;
          } else {
            p.bumpTimer += delta * simSpeed;
            p.body.position.y = 0.45;
            p.head.position.y = 1.04;
            if (p.bumpTimer > 0.12) {
              p.bumpTimer = 0;
              p.idleTime = 0.05 + Math.random() * 0.2;
            }
            p.stuckFrames++;
            if (p.stuckFrames > 40) {
              const snap = snapToNearestWalkable(p.x, p.z);
              if (snap) { p.x = snap.x; p.z = snap.z; p.mesh.position.set(p.x, 0, p.z); }
              p.stuckFrames = 0;
            }
          }
          continue;
        }
      }
    }

    /* MOTOR DE INCENDIO */
    function createFireSystem(x, z, castShadow = !IS_MOBILE) {
      const origin = new THREE.Vector3(x, 0.2, z);

      const light = new THREE.PointLight(0xff4400, 0.3, 8, 2);
      light.position.set(origin.x, 0.8, origin.z);
      light.castShadow = castShadow;
      scene.add(light);

      const flameCount = IS_MOBILE ? 80 : 150;
      const flameGeo = new THREE.BufferGeometry();
      const flamePos = new Float32Array(flameCount * 3);
      const flameSpeeds = [];
      for (let i = 0; i < flameCount; i++) {
        flamePos[i*3]   = origin.x + (Math.random() - 0.5) * 0.5;
        flamePos[i*3+1] = Math.random() * FLAME_TOP;
        flamePos[i*3+2] = origin.z + (Math.random() - 0.5) * 0.5;
        flameSpeeds.push(FLAME_RISE_MIN + Math.random() * (FLAME_RISE_MAX - FLAME_RISE_MIN));
      }
      flameGeo.setAttribute('position', new THREE.BufferAttribute(flamePos, 3));
      const flameMat = new THREE.PointsMaterial({ color:0xff3700, size:0.23, transparent:true, opacity:0.8 });
      const flames = new THREE.Points(flameGeo, flameMat);
      flames.layers.set(1);
      scene.add(flames);

      const smokeGeo = new THREE.BufferGeometry();
      const smokePos = new Float32Array(MAX_SMOKE * 3);
      const smokeVel = [];
      for (let i = 0; i < MAX_SMOKE; i++) {
        smokePos[i*3]   = origin.x;
        smokePos[i*3+1] = -9999;
        smokePos[i*3+2] = origin.z;
        const angle = Math.random() * Math.PI * 2;
        const spreadSpeed = SMOKE_SPREAD_MIN + Math.random() * (SMOKE_SPREAD_MAX - SMOKE_SPREAD_MIN);
        smokeVel.push({
          vx: Math.cos(angle) * spreadSpeed,
          vy: PLUME_RISE_MIN + Math.random() * (PLUME_RISE_MAX - PLUME_RISE_MIN),
          vz: Math.sin(angle) * spreadSpeed,
          cooling: false,
          cool: LAYER_DESCENT_MIN + Math.random() * (LAYER_DESCENT_MAX - LAYER_DESCENT_MIN)
        });
      }
      smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));

      const smokeMat = new THREE.PointsMaterial({
        color:0x1a1a1a, size:0.33, transparent:true, opacity:0.25, depthWrite:false
      });
      const smoke = new THREE.Points(smokeGeo, smokeMat);
      smoke.visible = false;
      smoke.frustumCulled = false;
      smoke.layers.set(1);
      scene.add(smoke);

      const sArr = smokeGeo.attributes.position.array;
      const fArr = flameGeo.attributes.position.array;
      let phase = 0;

      return {
        origin, active:true, activeSmokeCount:0, spawnAccumulator:0, smokeArray:sArr,
        light, flames, smoke,
        dispose() {
          light.visible  = false;
          flames.visible = false;
          smoke.visible  = false;
          scene.remove(light);
          scene.remove(flames);
          scene.remove(smoke);
          flameGeo.dispose();
          flameMat.dispose();
          smokeGeo.dispose();
          smokeMat.dispose();
        },
        toggle(state) {
          this.active = state;
          light.visible = state;
          flames.visible = state;
          if (!state && this.activeSmokeCount === 0) smoke.visible = false;
        },
        clearSmoke() {
          for (let i = 0; i < MAX_SMOKE; i++) {
            sArr[i*3] = 0; sArr[i*3+1] = -9999; sArr[i*3+2] = 0;
            smokeVel[i].cooling = false;
          }
          smokeGeo.attributes.position.needsUpdate = true;
          this.activeSmokeCount = 0;
          this.spawnAccumulator = 0;
          smoke.visible = false;
        },
        update(time, dt) {
          const dtSim = dt * simSpeed;
          if (this.active) {
            light.intensity = 0.2 + Math.sin(time*15*simSpeed + origin.x)*0.1 + Math.random()*0.1;
            for (let i = 0; i < flameCount; i++) {
              fArr[i*3+1] += flameSpeeds[i] * dtSim;
              if (fArr[i*3+1] > FLAME_TOP) {
                fArr[i*3+1] = 0.1;
                fArr[i*3]   = origin.x + (Math.random()-0.5)*0.5;
                fArr[i*3+2] = origin.z + (Math.random()-0.5)*0.5;
              }
            }
            flameGeo.attributes.position.needsUpdate = true;

            if (isSmokeGenerating) {
              this.spawnAccumulator += SMOKE_EMISSION_RATE * dtSim;
              const n = Math.floor(this.spawnAccumulator);
              this.spawnAccumulator -= n;
              for (let s = 0; s < n; s++) {
                if (this.activeSmokeCount < MAX_SMOKE) {
                  const idx = this.activeSmokeCount * 3;
                  sArr[idx]   = origin.x + (Math.random()-0.5)*0.5;
                  sArr[idx+1] = SMOKE_SPAWN_Y;
                  sArr[idx+2] = origin.z + (Math.random()-0.5)*0.5;
                  smokeVel[this.activeSmokeCount].cooling = false;
                  this.activeSmokeCount++;
                }
              }
            }
          }
          smoke.visible = this.activeSmokeCount > 0;

          const ceilingLimit = TECHO_HUMO;
          phase = (phase + 1) % SMOKE_STRIDE;
          const step = SMOKE_STRIDE * dtSim;

          for (let i = phase; i < this.activeSmokeCount; i += SMOKE_STRIDE) {
            const idx = i * 3;
            if (sArr[idx+1] > -100) {
              let nextX = sArr[idx];
              let nextZ = sArr[idx+2];
              if (!smokeVel[i].cooling) {
                sArr[idx+1] += smokeVel[i].vy * step;
                nextX += (Math.random()-0.5) * SMOKE_LATERAL_JITTER * step;
                nextZ += (Math.random()-0.5) * SMOKE_LATERAL_JITTER * step;
                if (sArr[idx+1] >= ceilingLimit) {
                  sArr[idx+1] = ceilingLimit;
                  smokeVel[i].cooling = true;
                }
              } else {
                smokeVel[i].vx = Math.max(-SMOKE_SPREAD_MAX, Math.min(SMOKE_SPREAD_MAX, smokeVel[i].vx));
                smokeVel[i].vz = Math.max(-SMOKE_SPREAD_MAX, Math.min(SMOKE_SPREAD_MAX, smokeVel[i].vz));
                nextX += smokeVel[i].vx * step;
                nextZ += smokeVel[i].vz * step;
                sArr[idx+1] -= smokeVel[i].cool * step;
              }

              const prevX = sArr[idx];
              const prevZ = sArr[idx + 2];
              let blocked = false;
              if (collisionGrid) {
                const gX = Math.floor((nextX - gridMinX) / GRID_RES);
                const gZ = Math.floor((nextZ - gridMinZ) / GRID_RES);
                if (gX >= 0 && gX < gridStepsX && gZ >= 0 && gZ < gridStepsZ) {
                  if (collisionGrid[gX + gZ * gridStepsX] === 1) blocked = true;
                }
              }
              if (!blocked && wouldHitBarrier(prevX, prevZ, nextX, nextZ, sArr[idx+1])) blocked = true;

              if (blocked) {
                smokeVel[i].vx *= -0.5;
                smokeVel[i].vz *= -0.5;
                smokeVel[i].vx += (Math.random()-0.5)*0.2;
                smokeVel[i].vz += (Math.random()-0.5)*0.2;
                nextX = sArr[idx];
                nextZ = sArr[idx+2];
              }

              sArr[idx]   = nextX;
              sArr[idx+2] = nextZ;
              if (sArr[idx+1] < SMOKE_FLOOR)  sArr[idx+1] = SMOKE_FLOOR;
              if (sArr[idx+1] > ceilingLimit) sArr[idx+1] = ceilingLimit;
            }
          }
          smokeGeo.attributes.position.needsUpdate = true;
        }
      };
    }

    const fires = [];
    const MAX_FIRES = IS_MOBILE ? 3 : 6;
    let _fireLimitTimer = null;

    function addFireAt(x, z) {
      if (fires.length >= MAX_FIRES) return null;
      const f = createFireSystem(x, z, false);
      f.toggle(true);
      fires.push(f);
      return f;
    }

    function removeAllFires() {
      while (fires.length > 0) {
        const f = fires.pop();
        f.toggle(false);
        f.clearSmoke();
        f.dispose();
      }
    }

    const btnGenerarIncendio = document.getElementById('btn-generar-incendio');
    const btnQuitarIncendios = document.getElementById('btn-quitar-incendios');

    function updateFireButtonLabel() {
      if (!btnGenerarIncendio) return;
      btnGenerarIncendio.textContent = firePlacementMode
        ? '✕ Cancelar (clic en el mapa)'
        : 'Generar Incendio';
    }

    function setFirePlacementMode(on) {
      firePlacementMode = on;
      if (btnGenerarIncendio) btnGenerarIncendio.classList.toggle('active', on);
      updateFireButtonLabel();
      renderer.domElement.style.cursor = on ? 'crosshair' : 'default';
    }

    function flashFireLimit() {
      if (!btnGenerarIncendio) return;
      btnGenerarIncendio.textContent = 'Límite: ' + MAX_FIRES + ' focos';
      clearTimeout(_fireLimitTimer);
      _fireLimitTimer = setTimeout(updateFireButtonLabel, 1400);
    }

    if (btnGenerarIncendio) {
      btnGenerarIncendio.addEventListener('click', () => {
        setFirePlacementMode(!firePlacementMode);
        if (firePlacementMode) toggleMenu(false);
      });
    }

    if (btnQuitarIncendios) {
      btnQuitarIncendios.addEventListener('click', () => {
        removeAllFires();
        setFirePlacementMode(false);
      });
    }

    document.getElementById('btn-limpiar').addEventListener('click', () => fires.forEach(f => f.clearSmoke()));

    const btnDetenerHumo = document.getElementById('btn-detener-humo');
    btnDetenerHumo.addEventListener('click', () => {
      isSmokeGenerating = !isSmokeGenerating;
      if (isSmokeGenerating) {
        btnDetenerHumo.innerText = "Detener Humo";
        btnDetenerHumo.classList.remove("stopped");
      } else {
        btnDetenerHumo.innerText = "Reanudar Humo";
        btnDetenerHumo.classList.add("stopped");
      }
    });

    /* UI */
    const chkPersonas = document.getElementById('chk-personas');
    const chkMovimiento = document.getElementById('chk-movimiento');
    const chkEvacuacion = document.getElementById('chk-evacuacion');
    const chkAutoRomper = document.getElementById('chk-auto-romper');
    const rngRojo = document.getElementById('rng-cant-rojo');
    const lblRojo = document.getElementById('lbl-cant-rojo');
    const rngVerde = document.getElementById('rng-cant-verde');
    const lblVerde = document.getElementById('lbl-cant-verde');
    const rngNaranja = document.getElementById('rng-cant-naranja');
    const lblNaranja = document.getElementById('lbl-cant-naranja');
    const rngAzul = document.getElementById('rng-cant-azul');
    const lblAzul = document.getElementById('lbl-cant-azul');
    const rngSimVel = document.getElementById('rng-sim-vel');
    const lblSimVel = document.getElementById('lbl-sim-vel');
    const btnResetPersonas = document.getElementById('btn-reset-personas');

    if (chkPersonas) {
      chkPersonas.addEventListener('change', (e) => {
        isPeopleVisible = e.target.checked;
        people.forEach(p => p.mesh.visible = isPeopleVisible);
      });
    }
    if (chkMovimiento) {
      chkMovimiento.addEventListener('change', (e) => { isPeopleMoving = e.target.checked; });
    }
    if (chkEvacuacion) {
      chkEvacuacion.addEventListener('change', (e) => {
        evacuationMode = e.target.checked;
        people.forEach(p => {
          if (p.isDead) return;
          p.state = 'wandering';
          p.reactionDelay = 0;
          if (evacuationMode) {
            p.wanderAngle = Math.random() * Math.PI * 2;
            p.wanderTimer = 1.0 + Math.random() * 2.0;
          }
        });
      });
    }
    if (chkAutoRomper) {
      chkAutoRomper.addEventListener('change', (e) => { autoBreakOnMortal = e.target.checked; });
    }
    if (rngSimVel) {
      rngSimVel.addEventListener('input', (e) => {
        simSpeed = parseFloat(e.target.value);
        if (lblSimVel) lblSimVel.textContent = simSpeed.toFixed(1) + 'x';
      });
    }

    const btnRepararVidrios = document.getElementById('btn-reparar-vidrios');
    if (btnRepararVidrios) {
      btnRepararVidrios.addEventListener('click', () => { repairAllWindows(); });
    }

    function respawnFromSliders() {
      spawnPeople(
        parseInt(rngRojo ? rngRojo.value : 8),
        parseInt(rngVerde ? rngVerde.value : 4),
        parseInt(rngNaranja ? rngNaranja.value : 4),
        parseInt(rngAzul ? rngAzul.value : 4)
      );
    }

    if (rngRojo) rngRojo.addEventListener('input', (e) => {
      const c = parseInt(e.target.value);
      if (lblRojo) lblRojo.textContent = c;
      spawnRoom('rojo', c);
    });
    if (rngVerde) rngVerde.addEventListener('input', (e) => {
      const c = parseInt(e.target.value);
      if (lblVerde) lblVerde.textContent = c;
      spawnRoom('verde', c);
    });
    if (rngNaranja) rngNaranja.addEventListener('input', (e) => {
      const c = parseInt(e.target.value);
      if (lblNaranja) lblNaranja.textContent = c;
      spawnRoom('naranja', c);
    });
    if (rngAzul) rngAzul.addEventListener('input', (e) => {
      const c = parseInt(e.target.value);
      if (lblAzul) lblAzul.textContent = c;
      spawnRoom('azul', c);
    });
    if (btnResetPersonas) {
      btnResetPersonas.addEventListener('click', () => { respawnFromSliders(); });
    }

    /* MAPA DE CALOR */
    const colorGreen  = new THREE.Color(0xa8e6a8);
    const colorYellow = new THREE.Color(0xffeb3b);
    const colorRed    = new THREE.Color(0xf44336);
    const tempColor   = new THREE.Color();

    const floorPositions = floorGeo.attributes.position.array;
    const floorColors    = floorGeo.attributes.color.array;

    const HEAT_COLS = 80, HEAT_ROWS = 80, DENSITY_MAX = 20;
    const heatDensity = new Float32Array(HEAT_COLS * HEAT_ROWS);
    const heatSmooth  = new Float32Array(HEAT_COLS * HEAT_ROWS);
    const heatMinX  = floorCenterX - floorWidth / 2;
    const heatMinZ  = floorCenterZ - floorDepth / 2;
    const heatCellW = floorWidth  / HEAT_COLS;
    const heatCellD = floorDepth  / HEAT_ROWS;

    function computeDensity() {
      heatDensity.fill(0);
      for (let f = 0; f < fires.length; f++) {
        const fire = fires[f];
        if (!fire.active && fire.activeSmokeCount === 0) continue;
        const sArr = fire.smokeArray;
        const count = fire.activeSmokeCount;
        for (let i = 0; i < count; i++) {
          const idx = i * 3;
          const px = sArr[idx], pz = sArr[idx+2];
          if (px < heatMinX || px >= heatMinX + floorWidth)  continue;
          if (pz < heatMinZ || pz >= heatMinZ + floorDepth)  continue;
          const cx = ((px - heatMinX) / heatCellW) | 0;
          const cz = ((pz - heatMinZ) / heatCellD) | 0;
          if (cx >= 0 && cx < HEAT_COLS && cz >= 0 && cz < HEAT_ROWS)
            heatDensity[cx + cz * HEAT_COLS]++;
        }
      }
      for (let z = 1; z < HEAT_ROWS - 1; z++)
        for (let x = 1; x < HEAT_COLS - 1; x++) {
          const i = x + z * HEAT_COLS;
          heatSmooth[i] = (heatDensity[i]*4 +
            heatDensity[i-1] + heatDensity[i+1] +
            heatDensity[i-HEAT_COLS] + heatDensity[i+HEAT_COLS]) / 8;
        }
      for (let x = 0; x < HEAT_COLS; x++) {
        heatSmooth[x] = heatDensity[x];
        heatSmooth[x + (HEAT_ROWS-1)*HEAT_COLS] = heatDensity[x + (HEAT_ROWS-1)*HEAT_COLS];
      }
      for (let z = 0; z < HEAT_ROWS; z++) {
        heatSmooth[z*HEAT_COLS] = heatDensity[z*HEAT_COLS];
        heatSmooth[(HEAT_COLS-1) + z*HEAT_COLS] = heatDensity[(HEAT_COLS-1) + z*HEAT_COLS];
      }
    }

    function updateHeatmap() {
      for (let i = 0; i < vertexCount; i++) {
        const vx = floorPositions[i*3];
        const vz = floorPositions[i*3+2];
        let cx = ((vx - heatMinX) / heatCellW) | 0;
        let cz = ((vz - heatMinZ) / heatCellD) | 0;
        if (cx < 0) cx = 0; else if (cx >= HEAT_COLS) cx = HEAT_COLS - 1;
        if (cz < 0) cz = 0; else if (cz >= HEAT_ROWS) cz = HEAT_ROWS - 1;
        const density = heatSmooth[cx + cz * HEAT_COLS];
        let t = density / DENSITY_MAX; if (t > 1) t = 1;
        if (t > 0.5) {
          const u = (t - 0.5) * 2.0;
          tempColor.lerpColors(colorYellow, colorRed, u);
        } else {
          const u = t * 2.0;
          tempColor.lerpColors(colorGreen, colorYellow, u);
        }
        floorColors[i*3]   = tempColor.r * HEATMAP_INTENSITY;
        floorColors[i*3+1] = tempColor.g * HEATMAP_INTENSITY;
        floorColors[i*3+2] = tempColor.b * HEATMAP_INTENSITY;
      }
      floorGeo.attributes.color.needsUpdate = true;
    }

    function updateRoomStatus() {
      for (let r = 0; r < ROOMS.length; r++) {
        const room = ROOMS[r];
        let cx0 = Math.max(0, Math.floor((room.minX - heatMinX) / heatCellW));
        let cx1 = Math.min(HEAT_COLS, Math.ceil((room.maxX - heatMinX) / heatCellW));
        let cz0 = Math.max(0, Math.floor((room.minZ - heatMinZ) / heatCellD));
        let cz1 = Math.min(HEAT_ROWS, Math.ceil((room.maxZ - heatMinZ) / heatCellD));
        if (cx1 <= cx0 || cz1 <= cz0) continue;

        let greenCount = 0, yellowCount = 0, redCount = 0, total = 0, totalDensity = 0;
        for (let z = cz0; z < cz1; z++)
          for (let x = cx0; x < cx1; x++) {
            const density = heatSmooth[x + z * HEAT_COLS];
            let t = density / DENSITY_MAX; if (t > 1) t = 1;
            totalDensity += density;
            if (t >= ROOM_RED_T)         redCount++;
            else if (t >= ROOM_YELLOW_T) yellowCount++;
            else                         greenCount++;
            total++;
          }

        let estado = 'Normal';
        if (total > 0) {
          const redPct  = redCount / total;
          const warmPct = (yellowCount + redCount) / total;
          const avgDens = totalDensity / total;

          const limiteRedPct    = room.redPct     || ROOM_RED_PCT;
          const limiteMortal    = room.avgMortal  || ROOM_AVG_MORTAL;
          const limiteVdRedPct  = room.vdRedPct   || ROOM_VD_RED_PCT;
          const limiteVdWarmPct = room.vdWarmPct  || ROOM_VD_WARM_PCT;
          const limiteVDanger   = room.avgVDanger || ROOM_AVG_VDANGER;
          const limiteWarmPct   = room.warmPct    || ROOM_WARM_PCT;
          const limitePeligro   = room.avgDanger  || ROOM_AVG_DANGER;

          if (redPct >= limiteRedPct || avgDens >= limiteMortal) estado = 'Mortal';
          else if (redPct >= limiteVdRedPct || warmPct >= limiteVdWarmPct || avgDens >= limiteVDanger)
            estado = 'Muy Peligroso';
          else if (warmPct >= limiteWarmPct || avgDens >= limitePeligro)
            estado = 'Peligroso';
        }

        room.estado = estado;

        if (autoBreakOnMortal && estado === 'Mortal') {
          for (let w = 0; w < windowsList.length; w++) {
            const win = windowsList[w];
            if (!win.isBroken && win.room && win.room.id === room.id) {
              shatterWindow(win, 'mortal');
            }
          }
        }

        const el = document.getElementById(room.id);
        if (el) {
          if (el.textContent !== estado) el.textContent = estado;
          const cls = 'estado-' + estado.toLowerCase().replace(/\s+/g, '-');
          if (el.className !== cls) el.className = cls;
        }
      }
    }

    /* LOOP */
    const clock = new THREE.Clock();
    let frameCounter = 0, roomFrameCounter = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);
      const time  = clock.elapsedTime;

      for (let i = 0; i < fires.length; i++) fires[i].update(time, delta);
      updatePeople(delta, time);
      updateGlassShards(delta);
      updateDoors(delta);
      updateWindows(delta);

      if (frameCounter % HEATMAP_EVERY === 0) { computeDensity(); updateHeatmap(); }
      frameCounter++;

      if (roomFrameCounter % ROOM_STATUS_EVERY === 0) updateRoomStatus();
      roomFrameCounter++;

      controls.update();

      renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
      renderer.setScissorTest(false);
      renderer.render(scene, camera);

      const marco = document.getElementById('minimapa-marco');
      const rect = marco.getBoundingClientRect();
      if (rect.width > 4 && rect.height > 4) {
        const mapY = window.innerHeight - rect.bottom;
        renderer.setViewport(rect.left, mapY, rect.width, rect.height);
        renderer.setScissor(rect.left, mapY, rect.width, rect.height);
        renderer.setScissorTest(true);

        const bgOriginal = scene.background;
        scene.background = new THREE.Color(0x1a1a1a);
        renderer.render(scene, mapCamera);
        scene.background = bgOriginal;

        renderer.setScissorTest(false);
      }
    }
    animate();

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', () => { setTimeout(onResize, 250); });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (firePlacementMode) setFirePlacementMode(false);
        else toggleMenu(false);
      }
    });
  </script>
</body>
